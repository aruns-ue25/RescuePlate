name: RescuePlate CD

on:
  workflow_run:
    workflows: ["RescuePlate CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: RescuePlate-RG

  ACR_NAME: rescueplateacr26
  ACR_LOGIN_SERVER: rescueplateacr26-d6c8a0e0g7d6ajby.azurecr.io

  BACKEND_APP: rescueplate-userservice
  FRONTEND_APP: rescueplate-frontend

  BACKEND_API_URL: https://rescueplate-userservice.wittyrock-ff20867a.southeastasia.azurecontainerapps.io/api

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:

      # --------------------------------------------------
      # 1. Checkout the exact commit that passed CI
      # --------------------------------------------------
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # --------------------------------------------------
      # 2. Authenticate to Azure using GitHub OIDC
      # --------------------------------------------------
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------
      # 3. Authenticate Docker with Azure Container Registry
      # --------------------------------------------------
      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      # --------------------------------------------------
      # 4. Build and push backend image
      # --------------------------------------------------
      - name: Build and push UserService image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/UserService
          file: ./backend/UserService/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/rescueplate-userservice:${{ github.event.workflow_run.head_sha }}
            ${{ env.ACR_LOGIN_SERVER }}/rescueplate-userservice:latest

      # --------------------------------------------------
      # 5. Build and push frontend image
      # --------------------------------------------------
      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.BACKEND_API_URL }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/rescueplate-frontend:${{ github.event.workflow_run.head_sha }}
            ${{ env.ACR_LOGIN_SERVER }}/rescueplate-frontend:latest

      # --------------------------------------------------
      # 6. Deploy backend Container App
      # --------------------------------------------------
      - name: Deploy UserService
        run: |
          az containerapp update \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/rescueplate-userservice:${{ github.event.workflow_run.head_sha }}

      # --------------------------------------------------
      # 7. Deploy frontend Container App
      # --------------------------------------------------
      - name: Deploy Frontend
        run: |
          az containerapp update \
            --name ${{ env.FRONTEND_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/rescueplate-frontend:${{ github.event.workflow_run.head_sha }}

      # --------------------------------------------------
      # 8. Logout from Azure
      # --------------------------------------------------
      - name: Azure logout
        run: |
          az logout