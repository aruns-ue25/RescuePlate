name: RescuePlate CD

on:
  workflow_run:
    workflows: ["RescuePlate CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: RescuePlate-RG

  ACR_NAME: rescueplateacr26
  ACR_LOGIN_SERVER: rescueplateacr26-d6c8a0e0g7d6ajby.azurecr.io

  BACKEND_APP: rescueplate-userservice
  DONATION_APP: rescueplate-donationservice
  DELIVERY_APP: rescueplate-deliveryservice
  FRONTEND_APP: rescueplate-frontend
  REQUEST_APP: rescueplate-requestservice

  BACKEND_API_URL: https://rescueplate-userservice.wittyrock-ff20867a.southeastasia.azurecontainerapps.io/api
  DONATION_API_URL: https://rescueplate-donationservice.wittyrock-ff20867a.southeastasia.azurecontainerapps.io/api
  REQUEST_API_URL: https://rescueplate-requestservice.wittyrock-ff20867a.southeastasia.azurecontainerapps.io/api
  DELIVERY_API_URL: https://rescueplate-deliveryservice.wittyrock-ff20867a.southeastasia.azurecontainerapps.io/api

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}

    steps:

      # --------------------------------------------------
      # 1. Checkout the exact commit that passed CI
      # --------------------------------------------------
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # --------------------------------------------------
      # 2. Authenticate to Azure using GitHub OIDC
      # --------------------------------------------------
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------
      # 3. Authenticate Docker with Azure Container Registry
      # --------------------------------------------------
      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      # --------------------------------------------------
      # 4. Build and push backend image
      # --------------------------------------------------
      - name: Build and push UserService image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/UserService
          file: ./backend/UserService/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/rescueplate-userservice:${{ github.event.workflow_run.head_sha }}
            ${{ env.ACR_LOGIN_SERVER }}/rescueplate-userservice:latest

      - name: Build and push DonationService image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/DonationService
          file: ./backend/DonationService/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/rescueplate-donationservice:${{ github.event.workflow_run.head_sha }}
            ${{ env.ACR_LOGIN_SERVER }}/rescueplate-donationservice:latest

      - name: Build and push RequestWorkflowService image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/RequestWorkflowService
          file: ./backend/RequestWorkflowService/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/rescueplate-requestservice:${{ github.event.workflow_run.head_sha }}
            ${{ env.ACR_LOGIN_SERVER }}/rescueplate-requestservice:latest

      - name: Build and push DeliveryWorkflowService image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/DeliveryWorkflowService
          file: ./backend/DeliveryWorkflowService/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/rescueplate-deliveryworkflowservice:${{ github.event.workflow_run.head_sha }}
            ${{ env.ACR_LOGIN_SERVER }}/rescueplate-deliveryworkflowservice:latest

      # --------------------------------------------------
      # 5. Build and push frontend image
      # --------------------------------------------------
      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.BACKEND_API_URL }}
            VITE_DONATION_API_BASE_URL=${{ env.DONATION_API_URL }}
            VITE_REQUEST_API_BASE_URL=${{ env.REQUEST_API_URL }}
            VITE_DELIVERY_API_BASE_URL=${{ env.DELIVERY_API_URL }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/rescueplate-frontend:${{ github.event.workflow_run.head_sha }}
            ${{ env.ACR_LOGIN_SERVER }}/rescueplate-frontend:latest

      # --------------------------------------------------
      # 6. Deploy backend Container App
      # --------------------------------------------------
      - name: Deploy UserService
        run: |
          az containerapp update \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/rescueplate-userservice:${{ github.event.workflow_run.head_sha }}

      - name: Deploy DonationService
        run: |
          az containerapp update \
            --name ${{ env.DONATION_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/rescueplate-donationservice:${{ github.event.workflow_run.head_sha }}

      - name: Deploy RequestWorkflowService
        run: |
          az containerapp update \
            --name ${{ env.REQUEST_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/rescueplate-requestservice:${{ github.event.workflow_run.head_sha }} \
            --set-env-vars \
              Kafka__BootstrapServers=rescueplate-kafka.servicebus.windows.net:9093 \
              Kafka__RequestTopic=request-events \
              Kafka__NeedRequestTopic=need-request-events \
              Kafka__DonationTopic=donation-events \
              Kafka__ConsumerGroupId=rescueplate-requestworkflow-consumer-group \
              Kafka__EnableConsumer=true \
              Kafka__PublishRetries=3 \
              Kafka__RetryBackoffMs=500 \
              Kafka__SecurityProtocol=SASL_SSL \
              Kafka__SaslMechanism=PLAIN \
              Kafka__SaslUsername='$ConnectionString' \
              Kafka__SaslPassword=secretref:kafka-connection-string

      - name: Deploy DeliveryWorkflowService
        run: |
          az containerapp update \
            --name ${{ env.DELIVERY_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/rescueplate-deliveryworkflowservice:${{ github.event.workflow_run.head_sha }}

      - name: Configure DeliveryWorkflowService ingress
        run: |
          current_external="$(az containerapp show \
            --name ${{ env.DELIVERY_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.external" \
            --output tsv)"

          if [ -z "$current_external" ] || [ "$current_external" = "None" ]; then
            az containerapp ingress enable \
              --name ${{ env.DELIVERY_APP }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --type external \
              --target-port 8080
          elif [ "$current_external" = "true" ]; then
            current_port="$(az containerapp show \
              --name ${{ env.DELIVERY_APP }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.targetPort" \
              --output tsv)"

            if [ "$current_port" != "8080" ]; then
              echo "DeliveryWorkflowService ingress is external but target port is not 8080."
              exit 1
            fi
          else
            echo "DeliveryWorkflowService ingress exists but is not external. Stopping deployment for review."
            exit 1
          fi

      - name: Verify DeliveryWorkflowService health
        run: |
          delivery_fqdn="$(az containerapp show \
            --name ${{ env.DELIVERY_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)"

          if [ -z "$delivery_fqdn" ] || [ "$delivery_fqdn" = "None" ]; then
            echo "DeliveryWorkflowService has no ingress FQDN."
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-connrefused \
            "https://${delivery_fqdn}/health"

      # --------------------------------------------------
      # 7. Deploy frontend Container App
      # --------------------------------------------------
      - name: Deploy Frontend
        run: |
          az containerapp update \
            --name ${{ env.FRONTEND_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/rescueplate-frontend:${{ github.event.workflow_run.head_sha }}

      # --------------------------------------------------
      # 8. Logout from Azure
      # --------------------------------------------------
      - name: Azure logout
        run: |
          az logout