name: RescuePlate Sprint 2 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-sprint2-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sprint2_ci_user
          POSTGRES_PASSWORD: sprint2_ci_password
          POSTGRES_DB: sprint2_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sprint2_ci_user -d sprint2_ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: sprint2_ci_user
      POSTGRES_PASSWORD: sprint2_ci_password
      POSTGRES_DB: sprint2_ci_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: dotnet restore backend/RescuePlate.slnx

      - name: Build backend
        run: dotnet build backend/RescuePlate.slnx --no-restore --configuration Release

      - name: Run DonationService Unit Tests
        run: dotnet test backend/DonationService.UnitTests --configuration Release --no-restore

      - name: Run DonationService Integration Tests
        run: dotnet test backend/DonationService.IntegrationTests --configuration Release --no-restore
