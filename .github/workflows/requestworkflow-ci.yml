name: RescuePlate Sprint 3 - RequestWorkflowService CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  requestworkflowservice-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore RequestWorkflowService
        run: dotnet restore backend/RequestWorkflowService/RequestWorkflowService.csproj

      - name: Build RequestWorkflowService
        run: dotnet build backend/RequestWorkflowService/RequestWorkflowService.csproj --no-restore --configuration Release