name: RescuePlate Sprint 3 - RequestWorkflowService CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  requestworkflowservice-build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: RescuePlateDB
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d RescuePlateDB"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: RescuePlateDB
      ConnectionStrings__PostgreSQLConnection: "Host=localhost;Port=5432;Database=RescuePlateDB;Username=postgres;Password=postgres"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Solution & Projects
        run: |
          dotnet restore backend/RescuePlate.slnx
          dotnet restore backend/RequestWorkflowService.UnitTests
          dotnet restore backend/RequestWorkflowService.IntegrationTests

      - name: Build RequestWorkflowService
        run: dotnet build backend/RequestWorkflowService/RequestWorkflowService.csproj --no-restore --configuration Release

      - name: Run RequestWorkflowService Unit Tests
        run: dotnet test backend/RequestWorkflowService.UnitTests/RequestWorkflowService.UnitTests.csproj --configuration Release --no-restore

      - name: Run RequestWorkflowService Integration Tests
        run: dotnet test backend/RequestWorkflowService.IntegrationTests/RequestWorkflowService.IntegrationTests.csproj --configuration Release --no-restore
