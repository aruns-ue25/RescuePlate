er, db, conn);\r\n    }\r\n\r\n    [Fact]\r\n    public async Task FOD_U01_DonorArrangesCollection_ForAcceptedFoodOffer_Returns201Created()\r\n    {\r\n        // Arrange\r\n        var (controller, db, conn) = SetupTest();\r\n        using (conn)\r\n        {\r\n            TestDbContextFactory.SeedFoodOffer(\r\n                db, \r\n                offerId: 501, \r\n                orgFoodNeedRequestId: 301, \r\n                donorId: \u0022donor_food_1\u0022, \r\n                orgId: \u0022org_food_1\u0022, \r\n                status: \u0022ACCEPTED\u0022, \r\n                needTitle: \u002250 Warm Lunch Boxes\u0022, \r\n                donorName: \u0022Bakery Chef\u0022,\r\n                orgName: \u0022City Shelter\u0022);\r\n\r\n            db.ChangeTracker.Clear();\r\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_food_1\u0022, \u0022DONOR\u0022);\r\n\r\n            var dto = new ArrangeCollectionDto\r\n            {\r\n                RequestId = 501, // Corresponds to DonorOffers.Id\r\n                PickupAddress = \u0022100 Baker St, Kitchen\u0022,\r\n                DeliveryAddress = \u0022200 Community Center, Dock 2\u0022,\r\n                ContactName = \u0022Chef Mario\u0022,\r\n                ContactPhone = \u0022\u002B1 555-0101\u0022,\r\n                ScheduledCollectionTime = DateTimeOffset.UtcNow.AddHours(4),\r\n                Notes = \u0022Packed in temperature-controlled carriers\u0022\r\n            };\r\n\r\n            // Act\r\n            var result = await controller.ArrangeCollection(dto) as CreatedAtActionResult;\r\n\r\n            // Assert\r\n            result.Should().NotBeNull();\r\n            result!.StatusCode.Should().Be(201);\r\n            var response = result.Value as ApiResponse\u003CDeliveryTrackingResponseDto\u003E;\r\n            response.Should().NotBeNull();\r\n            response!.Success.Should().BeTrue();\r\n            response.Data.Should().NotBeNull();\r\n            response.Data!.DonationTitle.Should().Be(\u002250 Warm Lunch Boxes\u0022);\r\n            response.Data.DonorName.Should().Be(\u0022Bakery Chef\u0022);\r\n            response.Data.OrganizationName.Should().Be(\u0022City Shelter\u0022);\r\n\r\n            var arrangement = await db.DeliveryArrangements.Include(d =\u003E d.History).FirstOrDefaultAsync(d =\u003E d.RequestId == 501);\r\n            arrangement.Should().NotBeNull();\r\n            arrangement!.Status.Should().Be(\u0022CollectionArranged\u0022);\r\n            arrangement.DonorId.Should().Be(\u0022donor_food_1\u0022);\r\n            arrangement.DonorName.Should().Be(\u0022Bakery Chef\u0022);\r\n            arrangement.OrganizationId.Should().Be(\u0022org_food_1\u0022);\r\n            arrangement.OrganizationName.Should().Be(\u0022City Shelter\u0022);\r\n            arrangement.DonationTitle.Should().Be(\u002250 Warm Lunch Boxes\u0022);\r\n            arrangement.PickupAddress.Should().Be(\u0022100 Baker St, Kitchen\u0022);\r\n            arrangement.DeliveryAddress.Should().Be(\u0022200 Community Center, Dock 2\u0022);\r\n\r\n            arrangement.History.Should().HaveCount(1);\r\n            var history = arrangement.History.First();\r\n            history.PreviousStatus.Should().Be(\u0022Accepted\u0022);\r\n            history.NewStatus.Should().Be(\u0022CollectionArranged\u0022);\r\n            history.ChangedByUserId.Should().Be(\u0022donor_food_1\u0022);\r\n            history.ChangedByRole.Should().Be(\u0022DONOR\u0022);\r\n\r\n            var notifications = await db.DeliveryNotifications.ToListAsync();\r\n            notifications.Should().HaveCount(2);\r\n            notifications.Should().Contain(n =\u003E n.UserId == \u0022donor_food_1\u0022 \u0026\u0026 n.Type == \u0022COLLECTION_ARRANGED\u0022);\r\n            notifications.Should().Contain(n =\u003E n.UserId == \u0022org_food_1\u0022 \u0026\u0026 n.Type == \u0022COLLECTION_ARRANGED\u0022);\r\n        }\r\n    }\r\n\r\n    [Fact]\r\n    public async Task FOD_U02_OrganizationArrangesCollection_ForAcceptedFoodOffer_Returns201WithOrgAudit()\r\n    {\r\n        // Arrange\r\n        var (controller, db, conn) = SetupTest();\r\n        using (conn)\r\n        {\r\n            TestDbContextFactory.SeedFoodOffer(\r\n                db, \r\n                offerId: 502, \r\n                orgFoodNeedRequestId: 302, \r\n                donorId: \u0022donor_food_2\u0022, \r\n                orgId: \u0022org_food_2\u0022, \r\n                status: \u0022ACCEPTED\u0022, \r\n                needTitle: \u0022Fresh Fruit Crates\u0022,\r\n                donorName: \u0022Orchard Farm\u0022,\r\n                orgName: \u0022Youth Foundation\u0022);\r\n\r\n            db.ChangeTracker.Clear();\r\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022org_food_2\u0022, \u0022ORGANIZATION\u0022);\r\n\r\n            var dto = new ArrangeCollectionDto\r\n            {\r\n                RequestId = 502,\r\n                PickupAddress = \u0022Farm Gate 3, Orchard Rd\u0022,\r\n                DeliveryAddress = \u0022Youth Center Main Hall\u0022,\r\n                ContactName = \u0022Coordinator Sarah\u0022,\r\n                ContactPhone = \u0022\u002B1 555-0202\u0022,\r\n                ScheduledCollectionTime = DateTimeOffset.UtcNow.AddDays(1)\r\n            };\r\n\r\n            // Act\r\n            var result = await controller.ArrangeCollection(dto) as CreatedAtActionResult;\r\n\r\n            // Assert\r\n            result.Should().NotBeNull();\r\n            result!.StatusCode.Should().Be(201);\r\n            var response = result.Value as ApiResponse\u003CDeliveryTrackingResponseDto\u003E;\r\n            response!.Success.Should().BeTrue();\r\n\r\n            var history = await db.DeliveryStatusHistories.FirstOrDefaultAsync(h =\u003E h.ChangedByUserId == \u0022org_food_2\u0022);\r\n            history.Should().NotBeNull();\r\n            history!.ChangedByRole.Should().Be(\u0022ORGANIZATION\u0022);\r\n\r\n            var arrangement = await db.DeliveryArrangements.FirstOrDefaultAsync(d =\u003E d.RequestId == 502);\r\n            arrangement.Should().NotBeNull();\r\n            arrangement!.OrganizationId.Should().Be(\u0022org_food_2\u0022);\r\n            arrangement.DonorId.Should().Be(\u0022donor_food_2\u0022);\r\n        }\r\n    }\r\n\r\n    [Fact]\r\n    public async Task FOD_U03_ArrangeCollection_FoodOfferNotAccepted_Returns400BadRequest()\r\n    {\r\n        // Arrange\r\n        var (controller, db, conn) = SetupTest();\r\n        using (conn)\r\n        {\r\n            TestDbContextFactory.SeedFoodOffer(\r\n                db, \r\n                offerId: 503, \r\n                orgFoodNeedRequestId: 303, \r\n                donorId: \u0022donor_food_3\u0022, \r\n                orgId: \u0022org_food_3\u0022, \r\n                status: \u0022PENDING\u0022); // Pending, not accepted\r\n\r\n            db.ChangeTracker.Clear();\r\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_food_3\u0022, \u0022DONOR\u0022);\r\n\r\n            var dto = new ArrangeCollectionDto\r\n            {\r\n                RequestId = 503,\r\n                PickupAddress = \u0022Addr\u0022,\r\n                DeliveryAddress = \u0022Addr\u0022,\r\n                ContactName = \u0022Name\u0022,\r\n                ContactPhone = \u0022123\u0022,\r\n                ScheduledCollectionTime = DateTimeOffset.UtcNow.AddDays(1)\r\n            };\r\n\r\n            // Act\r\n            var result = await controller.ArrangeCollection(dto) as BadRequestObjectResult;\r\n\r\n            // Assert\r\n            result.Should().NotBeNull();\r\n            result!.StatusCode.Should().Be(400);\r\n            var response = result.Value as ApiResponse\u003CDeliveryTrackingResponseDto\u003E;\r\n            response!.Message.Should().Contain(\u0022PENDING\u0022);\r\n            (await db.DeliveryArrangements.CountAsync()).Should().Be(0);\r\n        }\r\n    }\r\n\r\n    [Fact]\r\n    public async Task FOD_U04_ArrangeCollection_UnrelatedUserForFoodOffer_Returns403Forbidden()\r\n    {\r\n        // Arrange\r\n        var (controller, db, conn) = SetupTest();\r\n        using (conn)\r\n        {\r\n            TestDbContextFactory.SeedFoodOffer(\r\n                db, \r\n                offerId: 504, \r\n                orgFoodNeedRequestId: 304, \r\n                donorId: \u0022donor_food_4\u0022, \r\n                orgId: \u0022org_food_4\u0022, \r\n                status: \u0022ACCEPTED\u0022);\r\n\r\n            db.ChangeTracker.Clear();\r\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022unrelated_party\u0022, \u0022DONOR\u0022);\r\n\r\n            var dto = new ArrangeCollectionDto\r\n            {\r\n                RequestId = 504,\r\n                PickupAddress = \u0022Addr\u0022,\r\n                DeliveryAddress = \u0022Addr\u0022,\r\n                ContactName = \u0022Name\u0022,\r\n                ContactPhone = \u0022123\u0022,\r\n                ScheduledCollectionTime = DateTimeOffset.UtcNow.AddDays(1)\r\n            };\r\n\r\n            // Act\r\n            var result = await controller.ArrangeCollection(dto) as ObjectResult;\r\n\r\n            // Assert\r\n            result.Should().NotBeNull();\r\n            result!.StatusCode.Should().Be(403);\r\n            (await db.DeliveryArrangements.CountAsync()).Should().Be(0);\r\n        }\r\n    }\r\n\r\n    [Fact]\r\n    public async Task FOD_U05_CompleteDonation_ForFoodOffer_SynchronizesDonorOfferStatusToCompleted()\r\n    {\r\n        // Arrange\r\n        var (controller, db, conn) = SetupTest();\r\n        using (conn)\r\n        {\r\n            TestDbContextFactory.SeedFoodOffer(\r\n                db, \r\n                offerId: 505, \r\n                orgFoodNeedRequestId: 305, \r\n                donorId: \u0022donor_food_5\u0022, \r\n                orgId: \u0022org_food_5\u0022, \r\n                status: \u0022ACCEPTED\u0022, \r\n                needTitle: \u0022Winter Relief Soup Cans\u0022);\r\n\r\n            // Pre-seed delivery arrangement in \u0027Received\u0027 status\r\n            var delivery = new DeliveryArrangement\r\n            {\r\n                RequestId = 505,\r\n                DonationId = 305,\r\n                DonationTitle = \u0022Winter Relief Soup Cans\u0022,\r\n                DonorId = \u0022donor_food_5\u0022,\r\n                DonorName = \u0022Soup Kitchen Donor\u0022,\r\n                OrganizationId = \u0022org_food_5\u0022,\r\n                OrganizationName = \u0022City Shelter\u0022,\r\n                PickupAddress = \u002250 Soup St\u0022,\r\n                DeliveryAddress = \u0022100 Shelter St\u0022,\r\n                ContactName = \u0022Contact Person\u0022,\r\n                ContactPhone = \u0022123456\u0022,\r\n                ScheduledCollectionTime = DateTime.UtcNow.AddDays(-1),\r\n                Status = \u0022Received\u0022,\r\n                ArrangedAt = DateTime.UtcNow.AddDays(-1),\r\n                CollectedAt = DateTime.UtcNow.AddHours(-10),\r\n                ReceivedAt = DateTime.UtcNow.AddHours(-2),\r\n                CreatedAt = DateTime.UtcNow.AddDays(-1)\r\n            };\r\n            db.DeliveryArrangements.Add(delivery);\r\n            await db.SaveChangesAsync();\r\n            db.ChangeTracker.Clear();\r\n\r\n            // Set caller as Organization\r\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022org_food_5\u0022, \u0022ORGANIZATION\u0022);\r\n\r\n            var dto = new CompleteDonationDto\r\n            {\r\n                Notes = \u0022All soup cans inspected and stored safely in pantry.\u0022\r\n            };\r\n\r\n            // Act\r\n            var result = await controller.CompleteDonation(delivery.Id, dto) as OkObjectResult;\r\n\r\n            // Assert\r\n            result.Should().NotBeNull();\r\n            result!.StatusCode.Should().Be(200);\r\n            var response = result.Value as ApiResponse\u003CDeliveryTrackingResponseDto\u003E;\r\n            response.Should().NotBeNull();\r\n            response!.Success.Should().BeTrue();\r\n            response.Data!.Status.Should().Be(\u0022Completed\u0022);\r\n\r\n            // Verify DeliveryArrangement in DB\r\n            var updatedDelivery = await db.DeliveryArrangements.FindAsync(delivery.Id);\r\n            updatedDelivery.Should().NotBeNull();\r\n            updatedDelivery!.Status.Should().Be(\u0022Completed\u0022);\r\n            updatedDelivery.CompletedAt.Should().NotBeNull();\r\n\r\n            // Authoritative verification: DonorOffers table in DB updated to \u0027COMPLETED\u0027\r\n            var rawConn = db.Database.GetDbConnection();\r\n            if (rawConn.State != ConnectionState.Open)\r\n            {\r\n                rawConn.Open();\r\n            }\r\n            using var cmd = rawConn.CreateCommand();\r\n            cmd.CommandText = \u0022SELECT \\\u0022Status\\\u0022 FROM \\\u0022DonorOffers\\\u0022 WHERE \\\u0022Id\\\u0022 = 505\u0022;\r\n            var offerStatus = (string?)cmd.ExecuteScalar();\r\n            offerStatus.Should().Be(\u0022COMPLETED\u0022);\r\n        }\r\n    }\r\n}\r\n","tests":[{"id":"e197a5dd-d448-ec39-1803-84b94f314ca3","name":"DeliveryWorkflowService.UnitTests.FoodOfferDeliveryUnitTests.FOD_U01_DonorArrangesCollection_ForAcceptedFoodOffer_Returns201Created","location":{"start":{"line":27,"column":5},"end":{"line":96,"column":6}}},{"id":"a2205684-ec75-bde3-237b-b32dc3eda959","name":"DeliveryWorkflowService.UnitTests.FoodOfferDeliveryUnitTests.FOD_U02_OrganizationArrangesCollection_ForAcceptedFoodOffer_Returns201WithOrgAudit","location":{"start":{"line":98,"column":5},"end":{"line":147,"column":6}}},{"id":"2e2e8346-96fe-37f0-abd2-c16e29e26113","name":"DeliveryWorkflowService.UnitTests.FoodOfferDeliveryUnitTests.FOD_U03_ArrangeCollection_FoodOfferNotAccepted_Returns400BadRequest","location":{"start":{"line":149,"column":5},"end":{"line":187,"column":6}}},{"id":"91b342b5-32ca-d456-878a-9f1ac7defa55","name":"DeliveryWorkflowService.UnitTests.FoodOfferDeliveryUnitTests.FOD_U04_ArrangeCollection_UnrelatedUserForFoodOffer_Returns403Forbidden","location":{"start":{"line":189,"column":5},"end":{"line":225,"column":6}}},{"id":"7acbebc9-cda0-94f2-f784-93a616fb49eb","name":"DeliveryWorkflowService.UnitTests.FoodOfferDeliveryUnitTests.FOD_U05_CompleteDonation_ForFoodOffer_SynchronizesDonorOfferStatusToCompleted","location":{"start":{"line":227,"column":5},"end":{"line":304,"column":6}}}]},"C:\\Users\\LENOVO\\Desktop\\CSP_Project\\RescuePlate\\backend\\DeliveryWorkflowService.UnitTests\\Helpers\\ControllerTestHelper.cs":{"language":"cs","source":"using System.Security.Claims;\nusing Microsoft.AspNetCore.Http;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace DeliveryWorkflowService.UnitTests.Helpers;\n\npublic static class ControllerTestHelper\n{\n    public static ControllerContext CreateControllerContext(string userId, string role = \u0022DONOR\u0022)\n    {\n        var claims = new List\u003CClaim\u003E\n        {\n            new Claim(ClaimTypes.NameIdentifier, userId),\n            new Claim(ClaimTypes.Role, role),\n            new Claim(\u0022id\u0022, userId),\n            new Claim(\u0022role\u0022, role)\n        };\n\n        var identity = new ClaimsIdentity(claims, \u0022TestAuth\u0022);\n        var principal = new ClaimsPrincipal(identity);\n\n        return new ControllerContext\n        {\n            HttpContext = new DefaultHttpContext { User = principal }\n        };\n    }\n}\n","tests":[]},"C:\\Users\\LENOVO\\Desktop\\CSP_Project\\RescuePlate\\backend\\DeliveryWorkflowService.UnitTests\\Helpers\\TestDbContextFactory.cs":{"language":"cs","source":"using System;\r\nusing System.Data;\r\nusing Microsoft.Data.Sqlite;\r\nusing Microsoft.EntityFrameworkCore;\r\nusing DeliveryWorkflowService.Data;\r\n\r\nnamespace DeliveryWorkflowService.UnitTests.Helpers;\r\n\r\npublic static class TestDbContextFactory\r\n{\r\n    public static DeliveryDbContext CreateDbContext(out SqliteConnection connection)\r\n    {\r\n        connection = new SqliteConnection(\u0022DataSource=:memory:\u0022);\r\n        connection.Open();\r\n\r\n        var options = new DbContextOptionsBuilder\u003CDeliveryDbContext\u003E()\r\n            .UseSqlite(connection)\r\n            .Options;\r\n\r\n        var context = new DeliveryDbContext(options);\r\n        context.Database.EnsureCreated();\r\n\r\n        // Ensure Requests table exists for raw SQL execution in DeliveriesController\r\n        using var cmd = connection.CreateCommand();\r\n        cmd.CommandText = @\u0022\r\n            CREATE TABLE IF NOT EXISTS \u0022\u0022Requests\u0022\u0022 (\r\n                \u0022\u0022Id\u0022\u0022 INTEGER PRIMARY KEY,\r\n                \u0022\u0022DonationId\u0022\u0022 INTEGER NOT NULL,\r\n                \u0022\u0022DonationTitle\u0022\u0022 TEXT,\r\n                \u0022\u0022OrganizationId\u0022\u0022 TEXT,\r\n                \u0022\u0022OrganizationName\u0022\u0022 TEXT,\r\n                \u0022\u0022DonorId\u0022\u0022 TEXT,\r\n                \u0022\u0022Status\u0022\u0022 TEXT\r\n            );\r\n            CREATE TABLE IF NOT EXISTS \u0022\u0022OrgNeedRequests\u0022\u0022 (\r\n                \u0022\u0022Id\u0022\u0022 INTEGER PRIMARY KEY,\r\n                \u0022\u0022Title\u0022\u0022 TEXT,\r\n                \u0022\u0022OrganizationId\u0022\u0022 TEXT,\r\n                \u0022\u0022OrganizationName\u0022\u0022 TEXT,\r\n                \u0022\u0022Status\u0022\u0022 TEXT\r\n            );\r\n            CREATE TABLE IF NOT EXISTS \u0022\u0022DonorOffers\u0022\u0022 (\r\n                \u0022\u0022Id\u0022\u0022 INTEGER PRIMARY KEY,\r\n                \u0022\u0022OrgFoodNeedRequestId\u0022\u0022 INTEGER NOT NULL,\r\n                \u0022\u0022OrgFoodNeedRequestTitle\u0022\u0022 TEXT,\r\n                \u0022\u0022DonorId\u0022\u0022 TEXT,\r\n                \u0022\u0022DonorName\u0022\u0022 TEXT,\r\n                \u0022\u0022Status\u0022\u0022 TEXT\r\n            );\r\n        \u0022;\r\n        cmd.ExecuteNonQuery();\r\n\r\n        return context;\r\n    }\r\n\r\n    public static void SeedRequest(\r\n        DeliveryDbContext context,\r\n        int requestId,\r\n        int donationId,\r\n        string donorId,\r\n        string orgId,\r\n        string status = \u0022ACCEPTED\u0022,\r\n        string? title = \u0022Surplus Fresh Apples\u0022,\r\n        string? orgName = \u0022City Hope Food Bank\u0022)\r\n    {\r\n        var conn = context.Database.GetDbConnection();\r\n        if (conn.State != ConnectionState.Open)\r\n        {\r\n            conn.Open();\r\n        }\r\n\r\n        using var cmd = conn.CreateCommand();\r\n        cmd.CommandText = @\u0022\r\n            INSERT OR REPLACE INTO \u0022\u0022Requests\u0022\u0022 (\u0022\u0022Id\u0022\u0022, \u0022\u0022DonationId\u0022\u0022, \u0022\u0022DonationTitle\u0022\u0022, \u0022\u0022OrganizationId\u0022\u0022, \u0022\u0022OrganizationName\u0022\u0022, \u0022\u0022DonorId\u0022\u0022, \u0022\u0022Status\u0022\u0022)\r\n            VALUES (@id, @donationId, @title, @orgId, @orgName, @donorId, @status);\r\n        \u0022;\r\n\r\n        AddParam(cmd, \u0022@id\u0022, requestId);\r\n        AddParam(cmd, \u0022@donationId\u0022, donationId);\r\n        AddParam(cmd, \u0022@title\u0022, (object?)title ?? DBNull.Value);\r\n        AddParam(cmd, \u0022@orgId\u0022, (object?)orgId ?? DBNull.Value);\r\n        AddParam(cmd, \u0022@orgName\u0022, (object?)orgName ?? DBNull.Value);\r\n        AddParam(cmd, \u0022@donorId\u0022, (object?)donorId ?? DBNull.Value);\r\n        AddParam(cmd, \u0022@status\u0022, (object?)status ?? DBNull.Value);\r\n\r\n        cmd.ExecuteNonQuery();\r\n    }\r\n\r\n    public static void SeedFoodOffer(\r\n        DeliveryDbContext context,\r\n        int offerId,\r\n        int orgFoodNeedRequestId,\r\n        string donorId,\r\n        string orgId,\r\n        string status = \u0022ACCEPTED\u0022,\r\n        string? needTitle = \u0022Fresh Bakery Buns for Shelter\u0022,\r\n        string? donorName = \u0022Bakery Donor\u0022,\r\n        string? orgName = \u0022Community Shelter\u0022)\r\n    {\r\n        var conn = context.Database.GetDbConnection();\r\n        if (conn.State != ConnectionState.Open)\r\n        {\r\n            conn.Open();\r\n        }\r\n\r\n        using (var cmd = conn.CreateCommand())\r\n        {\r\n            cmd.CommandText = @\u0022\r\n                INSERT OR REPLACE INTO \u0022\u0022OrgNeedRequests\u0022\u0022 (\u0022\u0022Id\u0022\u0022, \u0022\u0022Title\u0022\u0022, \u0022\u0022OrganizationId\u0022\u0022, \u0022\u0022OrganizationName\u0022\u0022, \u0022\u0022Status\u0022\u0022)\r\n                VALUES (@needId, @needTitle, @orgId, @orgName, \u0027OPEN\u0027);\r\n            \u0022;\r\n            AddParam(cmd, \u0022@needId\u0022, orgFoodNeedRequestId);\r\n            AddParam(cmd, \u0022@needTitle\u0022, (object?)needTitle ?? DBNull.Value);\r\n            AddParam(cmd, \u0022@orgId\u0022, (object?)orgId ?? DBNull.Value);\r\n            AddParam(cmd, \u0022@orgName\u0022, (object?)orgName ?? DBNull.Value);\r\n            cmd.ExecuteNonQuery();\r\n        }\r\n\r\n        using (var cmd = conn.CreateCommand())\r\n        {\r\n            cmd.CommandText = @\u0022\r\n                INSERT OR REPLACE INTO \u0022\u0022DonorOffers\u0022\u0022 (\u0022\u0022Id\u0022\u0022, \u0022\u0022OrgFoodNeedRequestId\u0022\u0022, \u0022\u0022OrgFoodNeedRequestTitle\u0022\u0022, \u0022\u0022DonorId\u0022\u0022, \u0022\u0022DonorName\u0022\u0022, \u0022\u0022Status\u0022\u0022)\r\n                VALUES (@offerId, @needId, @needTitle, @donorId, @donorName, @status);\r\n            \u0022;\r\n            AddParam(cmd, \u0022@offerId\u0022, offerId);\r\n            AddParam(cmd, \u0022@needId\u0022, orgFoodNeedRequestId);\r\n            AddParam(cmd, \u0022@needTitle\u0022, (object?)needTitle ?? DBNull.Value);\r\n            AddParam(cmd, \u0022@donorId\u0022, (object?)donorId ?? DBNull.Value);\r\n            AddParam(cmd, \u0022@donorName\u0022, (object?)donorName ?? DBNull.Value);\r\n            AddParam(cmd, \u0022@status\u0022, (object?)status ?? DBNull.Value);\r\n            cmd.ExecuteNonQuery();\r\n        }\r\n    }\r\n\r\n    private static void AddParam(IDbCommand cmd, string name, object value)\r\n    {\r\n        var p = cmd.CreateParameter();\r\n        p.ParameterName = name;\r\n        p.Value = value;\r\n        cmd.Parameters.Add(p);\r\n    }\r\n}\r\n","tests":[]},"C:\\Users\\LENOVO\\Desktop\\CSP_Project\\RescuePlate\\backend\\DeliveryWorkflowService.UnitTests\\MutationHardeningTests.cs":{"language":"cs","source":"using System;\nusing System.Linq;\nusing System.Threading.Tasks;\nusing FluentAssertions;\nusing Microsoft.AspNetCore.Mvc;\nusing Microsoft.EntityFrameworkCore;\nusing Microsoft.Extensions.Logging.Abstractions;\nusing DeliveryWorkflowService.Controllers;\nusing DeliveryWorkflowService.DTOs;\nusing DeliveryWorkflowService.Models;\nusing DeliveryWorkflowService.UnitTests.Helpers;\nusing Xunit;\n\nnamespace DeliveryWorkflowService.UnitTests;\n\n/// \u003Csummary\u003E\n/// Targeted mutation-killing unit test suite for Sprint 4 (DeliveryWorkflowService).\n/// Designed with concise, parameterized boundary tests and exact assertion checks\n/// to kill relational, conditional, null-coalescing, and state-transition mutants in DeliveriesController.\n/// \u003C/summary\u003E\npublic class MutationHardeningTests\n{\n    private (DeliveriesController controller, Data.DeliveryDbContext db, Microsoft.Data.Sqlite.SqliteConnection conn) SetupTest()\n    {\n        var db = TestDbContextFactory.CreateDbContext(out var conn);\n        var logger = NullLogger\u003CDeliveriesController\u003E.Instance;\n        var controller = new DeliveriesController(db, logger);\n        return (controller, db, conn);\n    }\n\n    // =========================================================================\n    // 1. Boundary \u0026 Relational Mutator Tests (Time check: \u003C= vs \u003C)\n    // =========================================================================\n\n    [Theory]\n    [InlineData(0)]   // Exact present boundary (UtcNow) - must be rejected\n    [InlineData(-10)]  // 10 seconds in the past - must be rejected\n    [InlineData(-3600)] // 1 hour in the past - must be rejected\n    public async Task ArrangeCollection_TimeInPastOrExactPresent_RejectsWithBadRequest(int secondsOffset)\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            TestDbContextFactory.SeedRequest(db, requestId: 501, donationId: 601, donorId: \u0022donor_mut\u0022, orgId: \u0022org_mut\u0022, status: \u0022ACCEPTED\u0022);\n            db.ChangeTracker.Clear();\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_mut\u0022, \u0022DONOR\u0022);\n\n            var dto = new ArrangeCollectionDto\n            {\n                RequestId = 501,\n                PickupAddress = \u0022123 Test St\u0022,\n                DeliveryAddress = \u0022456 Main St\u0022,\n                ContactName = \u0022John\u0022,\n                ContactPhone = \u0022\u002B123456789\u0022,\n                ScheduledCollectionTime = DateTimeOffset.UtcNow.AddSeconds(secondsOffset)\n            };\n\n            // Act\n            var result = await controller.ArrangeCollection(dto) as BadRequestObjectResult;\n\n            // Assert\n            result.Should().NotBeNull(\u0022time \u003C= UtcNow must trigger BadRequest\u0022);\n            result!.StatusCode.Should().Be(400);\n            var response = result.Value as ApiResponse\u003CDeliveryTrackingResponseDto\u003E;\n            response.Should().NotBeNull();\n            response!.Success.Should().BeFalse();\n            response.Message.Should().Contain(\u0022ScheduledCollectionTime must be a valid future timestamp\u0022);\n        }\n    }\n\n    [Fact]\n    public async Task ArrangeCollection_DefaultOrNullTime_RejectsWithBadRequest()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            TestDbContextFactory.SeedRequest(db, requestId: 502, donationId: 602, donorId: \u0022donor_mut\u0022, orgId: \u0022org_mut\u0022, status: \u0022ACCEPTED\u0022);\n            db.ChangeTracker.Clear();\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_mut\u0022, \u0022DONOR\u0022);\n\n            var dto = new ArrangeCollectionDto\n            {\n                RequestId = 502,\n                PickupAddress = \u0022123 Test St\u0022,\n                DeliveryAddress = \u0022456 Main St\u0022,\n                ContactName = \u0022John\u0022,\n                ContactPhone = \u0022\u002B123456789\u0022,\n                ScheduledCollectionTime = default(DateTimeOffset)\n            };\n\n            // Act\n            var result = await controller.ArrangeCollection(dto) as BadRequestObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(400);\n        }\n    }\n\n    // =========================================================================\n    // 2. Exact Value \u0026 Fallback String Mutator Tests (Null-coalescing mutants)\n    // =========================================================================\n\n    [Fact]\n    public async Task ArrangeCollection_WhitespaceRequestTitles_AppliesExactFallbackDefaults()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            TestDbContextFactory.SeedRequest(\n                db,\n                requestId: 503,\n                donationId: 603,\n                donorId: \u0022donor_mut\u0022,\n                orgId: \u0022org_mut\u0022,\n                status: \u0022ACCEPTED\u0022,\n                title: \u0022   \u0022,\n                orgName: \u0022   \u0022);\n            db.ChangeTracker.Clear();\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_mut\u0022, \u0022DONOR\u0022);\n\n            var dto = new ArrangeCollectionDto\n            {\n                RequestId = 503,\n                PickupAddress = \u0022  123 Test St  \u0022,\n                DeliveryAddress = \u0022  456 Main St  \u0022,\n                ContactName = \u0022  John Doe  \u0022,\n                ContactPhone = \u0022  \u002B123456789  \u0022,\n                ScheduledCollectionTime = DateTimeOffset.UtcNow.AddHours(2)\n            };\n\n            // Act\n            var result = await controller.ArrangeCollection(dto) as CreatedAtActionResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            var response = result!.Value as ApiResponse\u003CDeliveryTrackingResponseDto\u003E;\n            response.Should().NotBeNull();\n            response!.Data.Should().NotBeNull();\n            \n            // Kills mutants in string.IsNullOrWhiteSpace fallbacks\n            response.Data!.DonationTitle.Should().Be(\u0022Surplus Food Donation\u0022);\n            response.Data.OrganizationName.Should().Be(\u0022Organization User\u0022);\n            response.Data.DonorName.Should().Be(\u0022Donor User\u0022);\n\n            // Kills mutants in String.Trim()\n            response.Data.PickupAddress.Should().Be(\u0022123 Test St\u0022);\n            response.Data.DeliveryAddress.Should().Be(\u0022456 Main St\u0022);\n            response.Data.ContactName.Should().Be(\u0022John Doe\u0022);\n            response.Data.ContactPhone.Should().Be(\u0022\u002B123456789\u0022);\n        }\n    }\n\n    // =========================================================================\n    // 3. State-Machine \u0026 Status Transition Mutator Tests (Collected -\u003E Received -\u003E Completed)\n    // =========================================================================\n\n    [Theory]\n    [InlineData(\u0022CollectionArranged\u0022)]\n    [InlineData(\u0022Completed\u0022)]\n    public async Task ConfirmReceipt_InvalidPreconditionStatuses_RejectsWithBadRequest(string invalidStatus)\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = new DeliveryArrangement\n            {\n                RequestId = 504,\n                DonationId = 604,\n                DonorId = \u0022donor_mut\u0022,\n                OrganizationId = \u0022org_mut\u0022,\n                PickupAddress = \u0022A\u0022,\n                DeliveryAddress = \u0022B\u0022,\n                ContactName = \u0022C\u0022,\n                ContactPhone = \u0022123\u0022,\n                ScheduledCollectionTime = DateTime.UtcNow.AddDays(1),\n                Status = invalidStatus,\n                CreatedAt = DateTime.UtcNow\n            };\n            db.DeliveryArrangements.Add(arrangement);\n            await db.SaveChangesAsync();\n            db.ChangeTracker.Clear();\n\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022org_mut\u0022, \u0022ORGANIZATION\u0022);\n\n            // Act\n            var result = await controller.ConfirmReceipt(arrangement.Id) as BadRequestObjectResult;\n\n            // Assert - Kills relational/equality mutants in status checking\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(400);\n            var response = result.Value as ApiResponse\u003CDeliveryTrackingResponseDto\u003E;\n            response.Should().NotBeNull();\n            response!.Success.Should().BeFalse();\n            response.Message.Should().Match(m =\u003E m.Contains(\u0022must be \u0027Collected\u0027\u0022) || m.Contains(\u0022Receipt has already been confirmed\u0022));\n        }\n    }\n\n    [Theory]\n    [InlineData(\u0022CollectionArranged\u0022)]\n    [InlineData(\u0022Collected\u0022)]\n    public async Task CompleteDonation_InvalidPreconditionStatuses_RejectsWithBadRequest(string invalidStatus)\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = new DeliveryArrangement\n            {\n                RequestId = 505,\n                DonationId = 605,\n                DonorId = \u0022donor_mut\u0022,\n                OrganizationId = \u0022org_mut\u0022,\n                PickupAddress = \u0022A\u0022,\n                DeliveryAddress = \u0022B\u0022,\n                ContactName = \u0022C\u0022,\n                ContactPhone = \u0022123\u0022,\n                ScheduledCollectionTime = DateTime.UtcNow.AddDays(1),\n                Status = invalidStatus,\n                CreatedAt = DateTime.UtcNow\n            };\n            db.DeliveryArrangements.Add(arrangement);\n            await db.SaveChangesAsync();\n            db.ChangeTracker.Clear();\n\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_mut\u0022, \u0022DONOR\u0022);\n\n            // Act\n            var result = await controller.CompleteDonation(arrangement.Id) as BadRequestObjectResult;\n\n            // Assert - Kills relational/equality mutants in CompleteDonation status guard\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(400);\n            var response = result.Value as ApiResponse\u003CDeliveryTrackingResponseDto\u003E;\n            response.Should().NotBeNull();\n            response!.Success.Should().BeFalse();\n            response.Message.Should().Contain(\u0022must be \u0027Received\u0027\u0022);\n        }\n    }\n\n    // =========================================================================\n    // 4. Role Authorization \u0026 Admin Bypass Mutator Tests (GetTrackingById / RequestId)\n    // =========================================================================\n\n    [Theory]\n    [InlineData(\u0022donor_actual\u0022, \u0022DONOR\u0022, 200)]\n    [InlineData(\u0022org_actual\u0022, \u0022ORGANIZATION\u0022, 200)]\n    [InlineData(\u0022admin_user\u0022, \u0022ADMIN\u0022, 200)]\n    [InlineData(\u0022unrelated_stranger\u0022, \u0022DONOR\u0022, 403)]\n    [InlineData(\u0022unrelated_org\u0022, \u0022ORGANIZATION\u0022, 403)]\n    public async Task GetTrackingById_RoleAndOwnershipCombinations_EnforcesExactAccess(\n        string callerId,\n        string callerRole,\n        int expectedStatusCode)\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = new DeliveryArrangement\n            {\n                RequestId = 506,\n                DonationId = 606,\n                DonorId = \u0022donor_actual\u0022,\n                OrganizationId = \u0022org_actual\u0022,\n                PickupAddress = \u0022A\u0022,\n                DeliveryAddress = \u0022B\u0022,\n                ContactName = \u0022C\u0022,\n                ContactPhone = \u0022123\u0022,\n                ScheduledCollectionTime = DateTime.UtcNow.AddDays(1),\n                Status = \u0022CollectionArranged\u0022,\n                CreatedAt = DateTime.UtcNow\n            };\n            db.DeliveryArrangements.Add(arrangement);\n            await db.SaveChangesAsync();\n            db.ChangeTracker.Clear();\n\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(callerId, callerRole);\n\n            // Act\n            var actionResult = await controller.GetTrackingById(arrangement.Id);\n\n            // Assert - Kills compound boolean mutators (\u0026\u0026 vs ||) in authorization guards\n            if (expectedStatusCode == 200)\n            {\n                var okResult = actionResult as OkObjectResult;\n                okResult.Should().NotBeNull();\n                okResult!.StatusCode.Should().Be(200);\n            }\n            else\n            {\n                var statusResult = actionResult as ObjectResult;\n                statusResult.Should().NotBeNull();\n                statusResult!.StatusCode.Should().Be(403);\n            }\n        }\n    }\n\n    // =========================================================================\n    // 5. Notification Creation \u0026 Side Effect Verification (Mutation Statement Removal)\n    // =========================================================================\n\n    [Fact]\n    public async Task CompleteDonation_ValidFlow_CreatesDualNotificationsAndTimestamp()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = new DeliveryArrangement\n            {\n                RequestId = 507,\n                DonationId = 607,\n                DonationTitle = \u0022Fresh Bread\u0022,\n                DonorId = \u0022donor_notif\u0022,\n                OrganizationId = \u0022org_notif\u0022,\n                PickupAddress = \u0022A\u0022,\n                DeliveryAddress = \u0022B\u0022,\n                ContactName = \u0022C\u0022,\n                ContactPhone = \u0022123\u0022,\n                ScheduledCollectionTime = DateTime.UtcNow.AddDays(1),\n                Status = \u0022Received\u0022,\n                CreatedAt = DateTime.UtcNow\n            };\n            db.DeliveryArrangements.Add(arrangement);\n            await db.SaveChangesAsync();\n            db.ChangeTracker.Clear();\n\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022org_notif\u0022, \u0022ORGANIZATION\u0022);\n\n            // Act\n            var result = await controller.CompleteDonation(arrangement.Id) as OkObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(200);\n\n            // Kills statement-removal mutants for notification creation\n            var notifications = await db.DeliveryNotifications.Where(n =\u003E n.RelatedId == arrangement.Id).ToListAsync();\n            notifications.Should().HaveCount(2, \u0022Must generate exactly one notification for Donor and one for Organization\u0022);\n            notifications.Should().Contain(n =\u003E n.UserId == \u0022donor_notif\u0022 \u0026\u0026 n.Type == \u0022DONATION_COMPLETED\u0022);\n            notifications.Should().Contain(n =\u003E n.UserId == \u0022org_notif\u0022 \u0026\u0026 n.Type == \u0022DONATION_COMPLETED\u0022);\n\n            // Kills statement-removal / field-assignment mutants on UpdatedAt \u0026 CompletedAt\n            var persisted = await db.DeliveryArrangements.FindAsync(arrangement.Id);\n            persisted.Should().NotBeNull();\n            persisted!.Status.Should().Be(\u0022Completed\u0022);\n            persisted.CompletedAt.Should().NotBeNull();\n            persisted.UpdatedAt.Should().NotBeNull();\n        }\n    }\n}\n","tests":[{"id":"325f2650-9f9e-5c9a-9802-d3aea566b0a5","name":"DeliveryWorkflowService.UnitTests.MutationHardeningTests.ArrangeCollection_TimeInPastOrExactPresent_RejectsWithBadRequest","location":{"start":{"line":35,"column":5},"end":{"line":70,"column":6}}},{"id":"5d0159d9-aa0a-1172-17c3-a20979028a9a","name":"DeliveryWorkflowService.UnitTests.MutationHardeningTests.ArrangeCollection_TimeInPastOrExactPresent_RejectsWithBadRequest","location":{"start":{"line":35,"column":5},"end":{"line":70,"column":6}}},{"id":"9aa20c7c-dd2c-0bf5-3305-4634134c92fc","name":"DeliveryWorkflowService.UnitTests.MutationHardeningTests.ArrangeCollection_TimeInPastOrExactPresent_RejectsWithBadRequest","location":{"start":{"line":35,"column":5},"end":{"line":70,"column":6}}},{"id":"5e13ca55-32a8-505f-1054-2d9386965446","name":"DeliveryWorkflowService.U oller\u003E.Instance;\n        var delivLogger = NullLogger\u003CDeliveriesController\u003E.Instance;\n        var notifController = new NotificationsController(db, notifLogger);\n        var delivController = new DeliveriesController(db, delivLogger);\n        return (notifController, delivController, db, conn);\n    }\n\n    [Fact]\n    public async Task N_U01_CollectionArrangementSucceeds_CreatesUnreadCollectionArrangedNotifications()\n    {\n        // Arrange\n        var (notifController, delivController, db, conn) = SetupTest();\n        using (conn)\n        {\n            TestDbContextFactory.SeedRequest(db, requestId: 901, donationId: 1001, donorId: \u0022donor_n1\u0022, orgId: \u0022org_n1\u0022);\n            db.ChangeTracker.Clear();\n            delivController.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_n1\u0022, \u0022DONOR\u0022);\n\n            var dto = new ArrangeCollectionDto\n            {\n                RequestId = 901,\n                PickupAddress = \u0022Addr A\u0022,\n                DeliveryAddress = \u0022Addr B\u0022,\n                ContactName = \u0022Contact C\u0022,\n                ContactPhone = \u0022123\u0022,\n                ScheduledCollectionTime = DateTimeOffset.UtcNow.AddDays(1)\n            };\n\n            // Act\n            await delivController.ArrangeCollection(dto);\n\n            // Assert\n            var notifications = await db.DeliveryNotifications.ToListAsync();\n            notifications.Should().HaveCount(2);\n            notifications.Should().AllSatisfy(n =\u003E\n            {\n                n.Type.Should().Be(\u0022COLLECTION_ARRANGED\u0022);\n                n.IsRead.Should().BeFalse();\n            });\n            notifications.Select(n =\u003E n.UserId).Should().BeEquivalentTo(new[] { \u0022donor_n1\u0022, \u0022org_n1\u0022 });\n        }\n    }\n\n    [Fact]\n    public async Task N_U02_CollectionIsRecorded_CreatesUnreadDonationCollectedNotifications()\n    {\n        // Arrange\n        var (notifController, delivController, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = new DeliveryArrangement\n            {\n                RequestId = 902,\n                DonationId = 1002,\n                DonorId = \u0022donor_n2\u0022,\n                DonorName = \u0022Donor N2\u0022,\n                OrganizationId = \u0022org_n2\u0022,\n                OrganizationName = \u0022Org N2\u0022,\n                PickupAddress = \u0022Addr A\u0022,\n                DeliveryAddress = \u0022Addr B\u0022,\n                ContactName = \u0022Contact C\u0022,\n                ContactPhone = \u0022123\u0022,\n                ScheduledCollectionTime = DateTime.UtcNow.AddDays(1),\n                Status = \u0022CollectionArranged\u0022,\n                ArrangedAt = DateTime.UtcNow,\n                CreatedAt = DateTime.UtcNow\n            };\n            db.DeliveryArrangements.Add(arrangement);\n            await db.SaveChangesAsync();\n            db.ChangeTracker.Clear();\n\n            delivController.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_n2\u0022, \u0022DONOR\u0022);\n\n            // Act\n            await delivController.RecordCollection(arrangement.Id);\n\n            // Assert\n            var notifications = await db.DeliveryNotifications.Where(n =\u003E n.Type == \u0022DONATION_COLLECTED\u0022).ToListAsync();\n            notifications.Should().HaveCount(2);\n            notifications.Should().AllSatisfy(n =\u003E n.IsRead.Should().BeFalse());\n            notifications.Select(n =\u003E n.UserId).Should().BeEquivalentTo(new[] { \u0022donor_n2\u0022, \u0022org_n2\u0022 });\n        }\n    }\n\n    [Fact]\n    public async Task N_U03_ReceiptIsConfirmed_CreatesUnreadReceiptConfirmedNotificationForDonorOnly()\n    {\n        // Arrange\n        var (notifController, delivController, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = new DeliveryArrangement\n            {\n                RequestId = 903,\n                DonationId = 1003,\n                DonorId = \u0022donor_n3\u0022,\n                DonorName = \u0022Donor N3\u0022,\n                OrganizationId = \u0022org_n3\u0022,\n                OrganizationName = \u0022Org N3\u0022,\n                PickupAddress = \u0022Addr A\u0022,\n                DeliveryAddress = \u0022Addr B\u0022,\n                ContactName = \u0022Contact C\u0022,\n                ContactPhone = \u0022123\u0022,\n                ScheduledCollectionTime = DateTime.UtcNow.AddDays(1),\n                Status = \u0022Collected\u0022,\n                ArrangedAt = DateTime.UtcNow.AddHours(-2),\n                CollectedAt = DateTime.UtcNow.AddHours(-1),\n                CreatedAt = DateTime.UtcNow.AddHours(-2)\n            };\n            db.DeliveryArrangements.Add(arrangement);\n            await db.SaveChangesAsync();\n            db.ChangeTracker.Clear();\n\n            delivController.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022org_n3\u0022, \u0022ORGANIZATION\u0022);\n\n            // Act\n            await delivController.ConfirmReceipt(arrangement.Id);\n\n            // Assert\n            var notifications = await db.DeliveryNotifications.Where(n =\u003E n.Type == \u0022RECEIPT_CONFIRMED\u0022).ToListAsync();\n            notifications.Should().HaveCount(1);\n            notifications.First().UserId.Should().Be(\u0022donor_n3\u0022);\n            notifications.First().IsRead.Should().BeFalse();\n        }\n    }\n\n    [Fact]\n    public async Task N_U04_DonationIsCompleted_CreatesUnreadDonationCompletedNotifications()\n    {\n        // Arrange\n        var (notifController, delivController, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = new DeliveryArrangement\n            {\n                RequestId = 904,\n                DonationId = 1004,\n                DonorId = \u0022donor_n4\u0022,\n                DonorName = \u0022Donor N4\u0022,\n                OrganizationId = \u0022org_n4\u0022,\n                OrganizationName = \u0022Org N4\u0022,\n                PickupAddress = \u0022Addr A\u0022,\n                DeliveryAddress = \u0022Addr B\u0022,\n                ContactName = \u0022Contact C\u0022,\n                ContactPhone = \u0022123\u0022,\n                ScheduledCollectionTime = DateTime.UtcNow.AddDays(1),\n                Status = \u0022Received\u0022,\n                ArrangedAt = DateTime.UtcNow.AddHours(-3),\n                CollectedAt = DateTime.UtcNow.AddHours(-2),\n                ReceivedAt = DateTime.UtcNow.AddHours(-1),\n                CreatedAt = DateTime.UtcNow.AddHours(-3)\n            };\n            db.DeliveryArrangements.Add(arrangement);\n            await db.SaveChangesAsync();\n            db.ChangeTracker.Clear();\n\n            delivController.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_n4\u0022, \u0022DONOR\u0022);\n\n            // Act\n            await delivController.CompleteDonation(arrangement.Id);\n\n            // Assert\n            var notifications = await db.DeliveryNotifications.Where(n =\u003E n.Type == \u0022DONATION_COMPLETED\u0022).ToListAsync();\n            notifications.Should().HaveCount(2);\n            notifications.Should().AllSatisfy(n =\u003E n.IsRead.Should().BeFalse());\n            notifications.Select(n =\u003E n.UserId).Should().BeEquivalentTo(new[] { \u0022donor_n4\u0022, \u0022org_n4\u0022 });\n        }\n    }\n\n    [Fact]\n    public async Task N_U05_WorkflowOperationIsRejected_NoNotificationIsCreated()\n    {\n        // Arrange\n        var (notifController, delivController, db, conn) = SetupTest();\n        using (conn)\n        {\n            delivController.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_n1\u0022, \u0022DONOR\u0022);\n\n            var dto = new ArrangeCollectionDto { RequestId = 99999 }; // Unknown request\n\n            // Act\n            await delivController.ArrangeCollection(dto);\n\n            // Assert\n            (await db.DeliveryNotifications.CountAsync()).Should().Be(0);\n        }\n    }\n\n    [Fact]\n    public async Task N_U06_SameNotificationTypeAndRelatedArrangementAttempted_UniqueConstraintPreventsDuplicate()\n    {\n        // Arrange\n        var (notifController, delivController, db, conn) = SetupTest();\n        using (conn)\n        {\n            var notif1 = new DeliveryNotification\n            {\n                UserId = \u0022user_dupe\u0022,\n                Title = \u0022Arranged\u0022,\n                Message = \u0022Test\u0022,\n                Type = \u0022COLLECTION_ARRANGED\u0022,\n                RelatedId = 55,\n                IsRead = false,\n                CreatedAt = DateTime.UtcNow\n            };\n            db.DeliveryNotifications.Add(notif1);\n            await db.SaveChangesAsync();\n\n            var notifDuplicate = new DeliveryNotification\n            {\n                UserId = \u0022user_dupe\u0022,\n                Title = \u0022Arranged Again\u0022,\n                Message = \u0022Test Duplicate\u0022,\n                Type = \u0022COLLECTION_ARRANGED\u0022,\n                RelatedId = 55,\n                IsRead = false,\n                CreatedAt = DateTime.UtcNow\n            };\n            db.DeliveryNotifications.Add(notifDuplicate);\n\n            // Act \u0026 Assert\n            await Assert.ThrowsAsync\u003CDbUpdateException\u003E(async () =\u003E await db.SaveChangesAsync());\n        }\n    }\n\n    [Fact]\n    public async Task N_U07_DonorAndOrganizationIdsIdenticalOrBlank_NoDuplicateOrFailure()\n    {\n        // Arrange\n        var (notifController, delivController, db, conn) = SetupTest();\n        using (conn)\n        {\n            TestDbContextFactory.SeedRequest(db, requestId: 907, donationId: 1007, donorId: \u0022same_user\u0022, orgId: \u0022same_user\u0022);\n            db.ChangeTracker.Clear();\n            delivController.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022same_user\u0022, \u0022DONOR\u0022);\n\n            var dto = new ArrangeCollectionDto\n            {\n                RequestId = 907,\n                PickupAddress = \u0022Addr A\u0022,\n                DeliveryAddress = \u0022Addr B\u0022,\n                ContactName = \u0022Contact C\u0022,\n                ContactPhone = \u0022123\u0022,\n                ScheduledCollectionTime = DateTimeOffset.UtcNow.AddDays(1)\n            };\n\n            // Act\n            var result = await delivController.ArrangeCollection(dto) as CreatedAtActionResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(201);\n            var notifications = await db.DeliveryNotifications.Where(n =\u003E n.UserId == \u0022same_user\u0022).ToListAsync();\n            notifications.Should().HaveCount(1); // Safely deduplicated in AddNotificationIfUnique helper\n        }\n    }\n\n    [Fact]\n    public async Task N_U08_WorkflowTransactionFails_NotificationsRollBack()\n    {\n        // Arrange\n        var (notifController, delivController, db, conn) = SetupTest();\n        using (conn)\n        {\n            TestDbContextFactory.SeedRequest(db, requestId: 908, donationId: 1008, donorId: \u0022donor_n8\u0022, orgId: \u0022org_n8\u0022);\n\n            // Seed duplicate notification to cause unique index violation during SaveChanges inside transaction\n            db.DeliveryNotifications.Add(new DeliveryNotification\n            {\n                UserId = \u0022donor_n8\u0022,\n                Type = \u0022COLLECTION_ARRANGED\u0022,\n                RelatedId = 1, // Conflicts when arrangement gets ID 1\n                Title = \u0022Pre-seeded\u0022,\n                Message = \u0022Pre-seeded\u0022,\n                CreatedAt = DateTime.UtcNow\n            });\n            await db.SaveChangesAsync();\n            db.ChangeTracker.Clear();\n\n            delivController.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_n8\u0022, \u0022DONOR\u0022);\n\n            var dto = new ArrangeCollectionDto\n            {\n                RequestId = 908,\n                PickupAddress = \u0022Addr A\u0022,\n                DeliveryAddress = \u0022Addr B\u0022,\n                ContactName = \u0022Contact C\u0022,\n                ContactPhone = \u0022123\u0022,\n                ScheduledCollectionTime = DateTimeOffset.UtcNow.AddDays(1)\n            };\n\n            // Act\n            await delivController.ArrangeCollection(dto);\n\n            // Assert: arrangement insert was rolled back by transaction\n            (await db.DeliveryArrangements.CountAsync(d =\u003E d.RequestId == 908)).Should().Be(0);\n        }\n    }\n\n    [Fact]\n    public async Task N_U09_UserRequestsNotifications_ReturnsOnlyCallersNotificationsNewestFirst()\n    {\n        // Arrange\n        var (notifController, delivController, db, conn) = SetupTest();\n        using (conn)\n        {\n            var now = DateTime.UtcNow;\n            db.DeliveryNotifications.AddRange(\n                new DeliveryNotification { UserId = \u0022user_A\u0022, Title = \u0022Older\u0022, Message = \u0022M1\u0022, Type = \u0022COLLECTION_ARRANGED\u0022, RelatedId = 1, CreatedAt = now.AddHours(-2) },\n                new DeliveryNotification { UserId = \u0022user_A\u0022, Title = \u0022Newer\u0022, Message = \u0022M2\u0022, Type = \u0022DONATION_COLLECTED\u0022, RelatedId = 1, CreatedAt = now.AddHours(-1) },\n                new DeliveryNotification { UserId = \u0022user_B\u0022, Title = \u0022User B Notif\u0022, Message = \u0022M3\u0022, Type = \u0022COLLECTION_ARRANGED\u0022, RelatedId = 2, CreatedAt = now }\n            );\n            await db.SaveChangesAsync();\n            db.ChangeTracker.Clear();\n\n            notifController.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022user_A\u0022);\n\n            // Act\n            var result = await notifController.GetMyNotifications() as OkObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(200);\n            var response = result.Value as ApiResponse\u003CList\u003CDeliveryNotificationResponseDto\u003E\u003E;\n            response!.Data.Should().HaveCount(2);\n            response.Data![0].Title.Should().Be(\u0022Newer\u0022);\n            response.Data[1].Title.Should().Be(\u0022Older\u0022);\n            response.Data.Should().NotContain(n =\u003E n.UserId == \u0022user_B\u0022);\n        }\n    }\n\n    [Fact]\n    public async Task N_U10_UserHasNoNotifications_Returns200WithEmptyList()\n    {\n        // Arrange\n        var (notifController, delivController, db, conn) = SetupTest();\n        using (conn)\n        {\n            notifController.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022empty_user\u0022);\n\n            // Act\n            var result = await notifController.GetMyNotifications() as OkObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(200);\n            var response = result.Value as ApiResponse\u003CList\u003CDeliveryNotificationResponseDto\u003E\u003E;\n            response!.Data.Should().NotBeNull();\n            response.Data.Should().BeEmpty();\n        }\n    }\n\n    [Fact]\n    public async Task N_U11_UserMarksOwnUnreadNotificationAsRead_Returns200OK()\n    {\n        // Arrange\n        var (notifController, delivController, db, conn) = SetupTest();\n        using (conn)\n        {\n            var notif = new DeliveryNotification { UserId = \u0022user_mark\u0022, Title = \u0022T\u0022, Message = \u0022M\u0022, Type = \u0022T\u0022, RelatedId = 1, IsRead = false, CreatedAt = DateTime.UtcNow };\n            db.DeliveryNotifications.Add(notif);\n            await db.SaveChangesAsync();\n            db.ChangeTracker.Clear();\n\n            notifController.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022user_mark\u0022);\n\n            // Act\n            var result = await notifController.MarkAsRead(notif.Id) as OkObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(200);\n            var updated = await db.DeliveryNotifications.FirstAsync(n =\u003E n.Id == notif.Id);\n            updated.IsRead.Should().BeTrue();\n        }\n    }\n\n    [Fact]\n    public async Task N_U12_UserMarksAlreadyReadNotificationAsRead_IdempotentSuccess()\n    {\n        // Arrange\n        var (notifController, delivController, db, conn) = SetupTest();\n        using (conn)\n        {\n            var notif = new DeliveryNotification { UserId = \u0022user_mark\u0022, Title = \u0022T\u0022, Message = \u0022M\u0022, Type = \u0022T\u0022, RelatedId = 1, IsRead = true, CreatedAt = DateTime.UtcNow };\n            db.DeliveryNotifications.Add(notif);\n            await db.SaveChangesAsync();\n            db.ChangeTracker.Clear();\n\n            notifController.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022user_mark\u0022);\n\n            // Act\n            var result = await notifController.MarkAsRead(notif.Id) as OkObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(200);\n            var updated = await db.DeliveryNotifications.FirstAsync(n =\u003E n.Id == notif.Id);\n            updated.IsRead.Should().BeTrue();\n        }\n    }\n\n    [Fact]\n    public async Task N_U13_UserTriesToMarkAnotherUsersNotificationAsRead_Returns404NotFound()\n    {\n        // Arrange\n        var (notifController, delivController, db, conn) = SetupTest();\n        using (conn)\n        {\n            var notif = new DeliveryNotification { UserId = \u0022user_other\u0022, Title = \u0022T\u0022, Message = \u0022M\u0022, Type = \u0022T\u0022, RelatedId = 1, IsRead = false, CreatedAt = DateTime.UtcNow };\n            db.DeliveryNotifications.Add(notif);\n            await db.SaveChangesAsync();\n            db.ChangeTracker.Clear();\n\n            notifController.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022user_attacker\u0022);\n\n            // Act\n            var result = await notifController.MarkAsRead(notif.Id) as NotFoundObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(404);\n            var unchanged = await db.DeliveryNotifications.FirstAsync(n =\u003E n.Id == notif.Id);\n            unchanged.IsRead.Should().BeFalse();\n        }\n    }\n\n    [Fact]\n    public async Task N_U14_UserMarksAllNotificationsAsRead_OnlyCallersUnreadChange()\n    {\n        // Arrange\n        var (notifController, delivController, db, conn) = SetupTest();\n        using (conn)\n        {\n            db.DeliveryNotifications.AddRange(\n                new DeliveryNotification { UserId = \u0022user_A\u0022, Title = \u0022T1\u0022, Message = \u0022M1\u0022, Type = \u0022T1\u0022, RelatedId = 1, IsRead = false, CreatedAt = DateTime.UtcNow },\n                new DeliveryNotification { UserId = \u0022user_A\u0022, Title = \u0022T2\u0022, Message = \u0022M2\u0022, Type = \u0022T2\u0022, RelatedId = 2, IsRead = false, CreatedAt = DateTime.UtcNow },\n                new DeliveryNotification { UserId = \u0022user_B\u0022, Title = \u0022TB\u0022, Message = \u0022MB\u0022, Type = \u0022TB\u0022, RelatedId = 3, IsRead = false, CreatedAt = DateTime.UtcNow }\n            );\n            await db.SaveChangesAsync();\n            db.ChangeTracker.Clear();\n\n            notifController.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022user_A\u0022);\n\n            // Act\n            var result = await notifController.M ass RecordCollectionUnitTests\n{\n    private (DeliveriesController controller, Data.DeliveryDbContext db, Microsoft.Data.Sqlite.SqliteConnection conn) SetupTest()\n    {\n        var db = TestDbContextFactory.CreateDbContext(out var conn);\n        var logger = NullLogger\u003CDeliveriesController\u003E.Instance;\n        var controller = new DeliveriesController(db, logger);\n        return (controller, db, conn);\n    }\n\n    private async Task\u003CDeliveryArrangement\u003E SeedArrangementAsync(Data.DeliveryDbContext db, string status = \u0022CollectionArranged\u0022)\n    {\n        var arrangement = new DeliveryArrangement\n        {\n            RequestId = 501,\n            DonationId = 601,\n            DonationTitle = \u0022Fresh Milk\u0022,\n            DonorId = \u0022donor_c\u0022,\n            DonorName = \u0022Donor C\u0022,\n            OrganizationId = \u0022org_c\u0022,\n            OrganizationName = \u0022Org C\u0022,\n            PickupAddress = \u0022123 Street\u0022,\n            DeliveryAddress = \u0022456 Center\u0022,\n            ContactName = \u0022Contact C\u0022,\n            ContactPhone = \u00221234567890\u0022,\n            ScheduledCollectionTime = DateTime.UtcNow.AddDays(1),\n            Status = status,\n            ArrangedAt = DateTime.UtcNow,\n            CreatedAt = DateTime.UtcNow\n        };\n\n        db.DeliveryArrangements.Add(arrangement);\n        await db.SaveChangesAsync();\n        db.ChangeTracker.Clear();\n        return arrangement;\n    }\n\n    [Fact]\n    public async Task C_U01_DonorRecordsCollection_Returns200OK_StatusIsCollected()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = await SeedArrangementAsync(db, \u0022CollectionArranged\u0022);\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_c\u0022, \u0022DONOR\u0022);\n\n            var dto = new RecordCollectionDto { Notes = \u0022  Picked up on time  \u0022 };\n\n            // Act\n            var result = await controller.RecordCollection(arrangement.Id, dto) as OkObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(200);\n            var response = result.Value as ApiResponse\u003CDeliveryTrackingResponseDto\u003E;\n            response!.Success.Should().BeTrue();\n            response.Data.Should().NotBeNull();\n            response.Data!.Status.Should().Be(\u0022Collected\u0022);\n            response.Data.CollectedAt.Should().NotBeNull();\n            response.Data.UpdatedAt.Should().NotBeNull();\n\n            var updatedArrangement = await db.DeliveryArrangements.Include(d =\u003E d.History).FirstAsync(d =\u003E d.Id == arrangement.Id);\n            updatedArrangement.Status.Should().Be(\u0022Collected\u0022);\n            updatedArrangement.CollectedAt.Should().NotBeNull();\n\n            var history = updatedArrangement.History.FirstOrDefault(h =\u003E h.NewStatus == \u0022Collected\u0022);\n            history.Should().NotBeNull();\n            history!.PreviousStatus.Should().Be(\u0022CollectionArranged\u0022);\n            history.ChangedByUserId.Should().Be(\u0022donor_c\u0022);\n            history.ChangedByRole.Should().Be(\u0022DONOR\u0022);\n            history.Notes.Should().Be(\u0022Picked up on time\u0022);\n\n            var notifications = await db.DeliveryNotifications.Where(n =\u003E n.Type == \u0022DONATION_COLLECTED\u0022).ToListAsync();\n            notifications.Should().HaveCount(2);\n            notifications.Should().Contain(n =\u003E n.UserId == \u0022donor_c\u0022 \u0026\u0026 !n.IsRead \u0026\u0026 n.RelatedId == arrangement.Id);\n            notifications.Should().Contain(n =\u003E n.UserId == \u0022org_c\u0022 \u0026\u0026 !n.IsRead \u0026\u0026 n.RelatedId == arrangement.Id);\n        }\n    }\n\n    [Fact]\n    public async Task C_U02_IntendedOrganizationRecordsCollection_Returns403Forbidden()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = await SeedArrangementAsync(db, \u0022CollectionArranged\u0022);\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022org_c\u0022, \u0022ORGANIZATION\u0022);\n\n            // Act\n            var result = await controller.RecordCollection(arrangement.Id) as ObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(403);\n            var response = result.Value as ApiResponse\u003CDeliveryTrackingResponseDto\u003E;\n            response!.Success.Should().BeFalse();\n            response.Message.Should().Contain(\u0022Only the donor is authorized to mark this donation as delivered.\u0022);\n\n            var unchanged = await db.DeliveryArrangements.FirstAsync(d =\u003E d.Id == arrangement.Id);\n            unchanged.Status.Should().Be(\u0022CollectionArranged\u0022);\n            unchanged.CollectedAt.Should().BeNull();\n        }\n    }\n\n    [Fact]\n    public async Task C_U03_CollectionRequestIncludesNotes_HistoryRecordsTrimmedNotes()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = await SeedArrangementAsync(db, \u0022CollectionArranged\u0022);\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_c\u0022, \u0022DONOR\u0022);\n\n            var dto = new RecordCollectionDto { Notes = \u0022   Driver verified temperature   \u0022 };\n\n            // Act\n            await controller.RecordCollection(arrangement.Id, dto);\n\n            // Assert\n            var history = await db.DeliveryStatusHistories.FirstAsync(h =\u003E h.NewStatus == \u0022Collected\u0022);\n            history.Notes.Should().Be(\u0022Driver verified temperature\u0022);\n        }\n    }\n\n    [Fact]\n    public async Task C_U04_CollectionRequestOmitsNotes_HistoryNotesAreNull()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = await SeedArrangementAsync(db, \u0022CollectionArranged\u0022);\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_c\u0022, \u0022DONOR\u0022);\n\n            // Act\n            await controller.RecordCollection(arrangement.Id, null);\n\n            // Assert\n            var history = await db.DeliveryStatusHistories.FirstAsync(h =\u003E h.NewStatus == \u0022Collected\u0022);\n            history.Notes.Should().BeNull();\n        }\n    }\n\n    [Fact]\n    public async Task C_U05_DeliveryIdDoesNotExist_Returns404NotFound()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_c\u0022, \u0022DONOR\u0022);\n\n            // Act\n            var result = await controller.RecordCollection(9999) as NotFoundObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(404);\n        }\n    }\n\n    [Fact]\n    public async Task C_U06_UnrelatedUserAttemptsCollection_Returns403Forbidden()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = await SeedArrangementAsync(db, \u0022CollectionArranged\u0022);\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022unrelated_user\u0022, \u0022DONOR\u0022);\n\n            // Act\n            var result = await controller.RecordCollection(arrangement.Id) as ObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(403);\n\n 400BadRequest()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = await SeedArrangementAsync(db, \u0022Draft\u0022);\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_c\u0022, \u0022DONOR\u0022);\n\n            // Act\n            var result = await controller.RecordCollection(arrangement.Id) as BadRequestObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(400);\n        }\n    }\n\n    [Fact]\n    public async Task C_U10_NotesExceed500Chars_ReturnsValidationError()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = await SeedArrangementAsync(db, \u0022CollectionArranged\u0022);\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_c\u0022, \u0022DONOR\u0022);\n            controller.ModelState.AddModelError(\u0022Notes\u0022, \u0022Notes exceed 500 chars\u0022);\n\n            // Assert model validation error is caught\n            controller.ModelState.IsValid.Should().BeFalse();\n        }\n    }\n\n    [Fact]\n    public async Task C_U11_ConcurrentCollectionRequests_OnlyOneSucceeds()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = await SeedArrangementAsync(db, \u0022CollectionArranged\u0022);\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_c\u0022, \u0022DONOR\u0022);\n\n            // First call succeeds\n            var res1 = await controller.RecordCollection(arrangement.Id);\n            (res1 as OkObjectResult).Should().NotBeNull();\n\n            // Second call fails with 400\n            var res2 = await controller.RecordCollection(arrangement.Id) as BadRequestObjectResult;\n            res2.Should().NotBeNull();\n            res2!.StatusCode.Should().Be(400);\n\n            var historyCount = await db.DeliveryStatusHistories.CountAsync(h =\u003E h.DeliveryArrangementId == arrangement.Id \u0026\u0026 h.NewStatus == \u0022Collected\u0022);\n            historyCount.Should().Be(1);\n\n            var notifCount = await db.DeliveryNotifications.CountAsync(n =\u003E n.RelatedId == arrangement.Id \u0026\u0026 n.Type == \u0022DONATION_COLLECTED\u0022);\n            notifCount.Should().Be(2); // 1 donor, 1 org\n        }\n    }\n\n    [Fact]\n    public async Task C_U12_DatabaseFailureDuringSave_RollsBackTransaction()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = await SeedArrangementAsync(db, \u0022CollectionArranged\u0022);\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_c\u0022, \u0022DONOR\u0022);\n\n            // Seed duplicate notification to force DbUpdateException during save inside transaction\n            db.DeliveryNotifications.Add(new DeliveryNotification\n            {\n                UserId = \u0022donor_c\u0022,\n                Type = \u0022DONATION_COLLECTED\u0022,\n                RelatedId = arrangement.Id,\n                Title = \u0022Pre-existing\u0022,\n                Message = \u0022Pre-existing\u0022,\n                CreatedAt = DateTime.UtcNow\n            });\n            await db.SaveChangesAsync();\n            db.ChangeTracker.Clear();\n\n            // Act\n            var result = await controller.RecordCollection(arrangement.Id) as ObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(500);\n        }\n    }\n}\n","tests":[{"id":"2fab8103-e3b1-aaa0-9a6a-e475d7b6eb82","name":"DeliveryWorkflowService.UnitTests.RecordCollectionUnitTests.C_U01_DonorRecordsCollection_Returns200OK_S
