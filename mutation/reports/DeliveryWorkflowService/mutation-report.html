            app.report = {"files":{"C:\\Users\\LENOVO\\Desktop\\CSP_Project\\RescuePlate\\backend\\DeliveryWorkflowService\\Controllers\\DeliveriesController.cs":{"language":"cs","source":"using System.Security.Claims;\r\nusing Microsoft.AspNetCore.Authorization;\r\nusing Microsoft.AspNetCore.Mvc;\r\nusing Microsoft.EntityFrameworkCore;\r\nusing DeliveryWorkflowService.Data;\r\nusing DeliveryWorkflowService.DTOs;\r\nusing DeliveryWorkflowService.Models;\r\n\r\nnamespace DeliveryWorkflowService.Controllers;\r\n\r\n[ApiController]\r\n[Route(\u0022api/[controller]\u0022)]\r\n[Authorize]\r\npublic class DeliveriesController : ControllerBase\r\n{\r\n    private readonly DeliveryDbContext _context;\r\n    private readonly ILogger\u003CDeliveriesController\u003E _logger;\r\n\r\n    public DeliveriesController(DeliveryDbContext context, ILogger\u003CDeliveriesController\u003E logger)\r\n    {\r\n        _context = context;\r\n        _logger = logger;\r\n    }\r\n\r\n    /// \u003Csummary\u003E\r\n    /// Story 1: Arrange collection for an accepted donation.\r\n    /// Authorized for Donor (DonorId) or Organization (OrganizationId) associated with the request.\r\n    /// \u003C/summary\u003E\r\n    [HttpPost(\u0022arrange\u0022)]\r\n    [ProducesResponseType(typeof(ApiResponse\u003CDeliveryTrackingResponseDto\u003E), StatusCodes.Status201Created)]\r\n    [ProducesResponseType(typeof(ApiResponse\u003CDeliveryTrackingResponseDto\u003E), StatusCodes.Status400BadRequest)]\r\n    [ProducesResponseType(StatusCodes.Status403Forbidden)]\r\n    [ProducesResponseType(StatusCodes.Status404NotFound)]\r\n    public async Task\u003CIActionResult\u003E ArrangeCollection([FromBody] ArrangeCollectionDto dto)\r\n    {\r\n        if (!ModelState.IsValid)\r\n        {\r\n            var errors = ModelState.Values.SelectMany(v =\u003E v.Errors).Select(e =\u003E e.ErrorMessage).ToList();\r\n            return BadRequest(ApiResponse\u003CDeliveryTrackingResponseDto\u003E.Fail(\u0022Validation failed.\u0022, errors));\r\n        }\r\n\r\n        // Collection time validation: Must be non-null, non-default, and in the future\r\n        if (!dto.ScheduledCollectionTime.HasValue ||\r\n            dto.ScheduledCollectionTime.Value == default ||\r\n            dto.ScheduledCollectionTime.Value.UtcDateTime \u003C= DateTime.UtcNow)\r\n        {\r\n            return BadRequest(ApiResponse\u003CDeliveryTrackingResponseDto\u003E.Fail(\r\n                \u0022ScheduledCollectionTime must be a valid future timestamp.\u0022));\r\n        }\r\n\r\n        var (userId, userRole) = GetCallerIdentity();\r\n\r\n        // 1. Authoritative verification of Request acceptance from PostgreSQL database\r\n        var requestInfo = await VerifyRequestAcceptanceAsync(dto.RequestId);\r\n        if (requestInfo == null)\r\n        {\r\n            return NotFound(ApiResponse\u003CDeliveryTrackingResponseDto\u003E.Fail($\u0022Donation request with ID {dto.RequestId} was not found.\u0022));\r\n        }\r\n\r\n        if (requestInfo.Status != \u0022ACCEPTED\u0022)\r\n        {\r\n            return BadRequest(ApiResponse\u003CDeliveryTrackingResponseDto\u003E.Fail(\r\n                $\u0022Collection arrangement rejected. Donation request {dto.RequestId} is in status \u0027{requestInfo.Status}\u0027, but must be \u0027ACCEPTED\u0027.\u0022));\r\n        }\r\n\r\n        // 2. Strict Authorization Check (Story 1: Donor or Organization ONLY)\r\n        if (userId != requestInfo.DonorId \u0026\u0026 userId != requestInfo.OrganizationId)\r\n        {\r\n            return StatusCode(StatusCodes.Status403Forbidden,\r\n                ApiResponse\u003CDeliveryTrackingResponseDto\u003E.Fail(\u0022You are not authorized to arrange collection for this donation request.\u0022));\r\n        }\r\n\r\n        // 3. Duplicate arrangement check (Concurrency \u0026 Unique Index guard)\r\n        var existingArrangement = await _context.DeliveryArrangements\r\n            .AsNoTracking()\r\n            .AnyAsync(d =\u003E d.RequestId == dto.RequestId);\r\n        if (existingArrangement)\r\n        {\r\n            return BadRequest(ApiResponse\u003CDeliveryTrackingResponseDto\u003E.Fail(\r\n                $\u0022A collection arrangement has already been created for donation request {dto.RequestId}.\u0022));\r\n        }\r\n\r\n        // 4. Create DeliveryArrangement, History, and Notifications in a single atomic database transaction\r\n        using var transaction = await _context.Database.BeginTransactionAsync();\r\n        try\r\n        {\r\n            var now = DateTime.UtcNow;\r\n            var arrangement = new DeliveryArrangement\r\n            {\r\n                RequestId = dto.RequestId,\r\n                DonationId = requestInfo.DonationId,\r\n                DonationTitle = string.IsNullOrWhiteSpace(requestInfo.DonationTitle) ? \u0022Surplus Food Donation\u0022 : requestInfo.DonationTitle,\r\n                DonorId = requestInfo.DonorId,\r\n                DonorName = string.IsNullOrWhiteSpace(requestInfo.DonorName) ? \u0022Donor User\u0022 : requestInfo.DonorName,\r\n                OrganizationId = requestInfo.OrganizationId,\r\n                OrganizationName = string.IsNullOrWhiteSpace(requestInfo.OrganizationName) ? \u0022Organization User\u0022 : requestInfo.OrganizationName,\r\n                PickupAddress = dto.PickupAddress.Trim(),\r\n                DeliveryAddress = dto.DeliveryAddress.Trim(),\r\n                ContactName = dto.ContactName.Trim(),\r\n                ContactPhone = dto.ContactPhone.Trim(),\r\n                ScheduledCollectionTime = dto.ScheduledCollectionTime.Value.UtcDateTime,\r\n                Notes = dto.Notes?.Trim(),\r\n                Status = \u0022CollectionArranged\u0022,\r\n                ArrangedAt = now,\r\n                CreatedAt = now\r\n            };\r\n\r\n            var history = new DeliveryStatusHistory\r\n            {\r\n                PreviousStatus = \u0022Accepted\u0022,\r\n                NewStatus = \u0022CollectionArranged\u0022,\r\n                ChangedByUserId = userId,\r\n                ChangedByRole = userRole,\r\n                Notes = dto.Notes?.Trim(),\r\n                Timestamp = now\r\n            };\r\n\r\n            arrangement.History.Add(history);\r\n            _context.DeliveryArrangements.Add(arrangement);\r\n\r\n            // Save arrangement first to get valid Database Id for RelatedId\r\n            await _context.SaveChangesAsync();\r\n\r\n            // Add Notifications for Donor and Organization within the same transaction\r\n            var formattedTime = arrangement.ScheduledCollectionTime.ToString(\u0022yyyy-MM-dd HH:mm UTC\u0022);\r\n            var notifMsg = $\u0022Collection details for \u0027{arrangement.DonationTitle}\u0027 have been arranged for {formattedTime}.\u0022;\r\n\r\n            AddNotificationIfUnique(arrangement.DonorId, \u0022Collection Arranged\u0022, notifMsg, \u0022COLLECTION_ARRANGED\u0022, arrangement.Id, now);\r\n            AddNotificationIfUnique(arrangement.OrganizationId, \u0022Collection Arranged\u0022, notifMsg, \u0022COLLECTION_ARRANGED\u0022, arrangement.Id, now);\r\n\r\n            await _context.SaveChangesAsync();\r\n            await transaction.CommitAsync();\r\n\r\n            _logger.LogInformation(\u0022User {UserId} successfully arranged collection for Request {RequestId}, Delivery {DeliveryId}\u0022,\r\n                userId, dto.RequestId, arrangement.Id);\r\n\r\n            return CreatedAtAction(nameof(GetTrackingById), new { id = arrangement.Id },\r\n                ApiResponse\u003CDeliveryTrackingResponseDto\u003E.Ok(MapToDto(arrangement), \u0022Collection arrangement created successfully.\u0022));\r\n        }\r\n        catch (DbUpdateException ex)\r\n        {\r\n            await transaction.RollbackAsync();\r\n            _logger.LogWarning(ex, \u0022Duplicate arrangement or notification prevented for request {RequestId}\u0022, dto.RequestId);\r\n            return BadRequest(ApiResponse\u003CDeliveryTrackingResponseDto\u003E.Fail(\r\n                $\u0022A collection arrangement has already been created for donation request {dto.RequestId}.\u0022));\r\n        }\r\n        catch (Exception ex)\r\n        {\r\n            await transaction.RollbackAsync();\r\n            _logger.LogError(ex, \u0022Error creating collection arrangement for request {RequestId}\u0022, dto.RequestId);\r\n            return StatusCode(StatusCodes.Status500InternalServerError,\r\n                ApiResponse\u003CDeliveryTrackingResponseDto\u003E.Fail(\u0022An internal error occurred while creating collection arrangement.\u0022));\r\n        }\r\n    }\r\n\r\n    /// \u003Csummary\u003E\r\n    /// Story 2: Record that a donation has been collected.\r\n    /// Authorized for Donor (DonorId) or Organization (OrganizationId) associated with the donation.\r\n    /// \u003C/summary\u003E\r\n    [HttpPost(\u0022{id:int}/collect\u0022)]\r\n    [ProducesResponseType(typeof(ApiResponse\u003CDeliveryTrackingResponseDto\u003E), StatusCodes.Status200OK)]\r\n    [ProducesResponseType(typeof(ApiResponse\u003CDeliveryTrackingResponseDto\u003E), StatusCodes.Status400BadRequest)]\r\n    [ProducesResponseType(StatusCodes.Status403Forbidden)]\r\n    [ProducesResponseType(StatusCodes.Status404NotFound)]\r\n    public async Task\u003CIActionResult\u003E RecordCollection(int id, [FromBody] RecordCollectionDto? dto = null)\r\n    {\r\n        var (userId, userRole) = GetCallerIdentity();\r\n\r\n        var arrangement = await _context.DeliveryArrangements\r\n            .AsNoTracking()\r\n            .FirstOrDefaultAsync(d =\u003E d.Id == id);\r\n\r\n        if (arrangement == null)\r\n        {\r\n            return NotFound(ApiResponse\u003CDeliveryTrackingResponseDto\u003E.Fail($\u0022Delivery arrangement with ID {id} not found.\u0022));\r\n        }\r\n\r\n        // Strict Authorization Check: Donor ONLY\r\n        if (userId != arrangement.Donor sponse\u003CDeliveryTrackingResponseDto\u003E.Fail(\u0022An internal error occurred while confirming receipt.\u0022));\r\n        }\r\n    }\r\n\r\n    /// \u003Csummary\u003E\r\n    /// Story 4: Retrieve current tracking status and complete timestamped status history by delivery ID.\r\n    /// Authorized for Donor (DonorId), Organization (OrganizationId), or ADMIN.\r\n    /// \u003C/summary\u003E\r\n    [HttpGet(\u0022{id:int}\u0022)]\r\n    [ProducesResponseType(typeof(ApiResponse\u003CDeliveryTrackingResponseDto\u003E), StatusCodes.Status200OK)]\r\n    [ProducesResponseType(StatusCodes.Status403Forbidden)]\r\n    [ProducesResponseType(StatusCodes.Status404NotFound)]\r\n    public async Task\u003CIActionResult\u003E GetTrackingById(int id)\r\n    {\r\n        var (userId, userRole) = GetCallerIdentity();\r\n\r\n        var arrangement = await _context.DeliveryArrangements\r\n            .AsNoTracking()\r\n            .Include(d =\u003E d.History)\r\n            .FirstOrDefaultAsync(d =\u003E d.Id == id);\r\n\r\n        if (arrangement == null)\r\n        {\r\n            return NotFound(ApiResponse\u003CDeliveryTrackingResponseDto\u003E.Fail($\u0022Delivery tracking with ID {id} not found.\u0022));\r\n        }\r\n\r\n        // Authorization Check (Story 4: Donor, Organization, or ADMIN)\r\n        if (userId != arrangement.DonorId \u0026\u0026 userId != arrangement.OrganizationId \u0026\u0026 !userRole.Equals(\u0022ADMIN\u0022, StringComparison.OrdinalIgnoreCase))\r\n        {\r\n            return StatusCode(StatusCodes.Status403Forbidden,\r\n                ApiResponse\u003CDeliveryTrackingResponseDto\u003E.Fail(\u0022You are not authorized to view tracking information for this donation.\u0022));\r\n        }\r\n\r\n        return Ok(ApiResponse\u003CDeliveryTrackingResponseDto\u003E.Ok(MapToDto(arrangement)));\r\n    }\r\n\r\n    /// \u003Csummary\u003E\r\n    /// Story 4: Retrieve current tracking status and complete timestamped status history by food reques .cs":{"language":"cs","source":"using System;\nusing System.Linq;\nusing System.Threading.Tasks;\nusing FluentAssertions;\nusing Microsoft.AspNetCore.Mvc;\nusing Microsoft.EntityFrameworkCore;\nusing Microsoft.Extensions.Logging.Abstractions;\nusing DeliveryWorkflowService.Controllers;\nusing DeliveryWorkflowService.DTOs;\nusing DeliveryWorkflowService.Models;\nusing DeliveryWorkflowService.UnitTests.Helpers;\nusing Xunit;\n\nnamespace DeliveryWorkflowService.UnitTests;\n\npublic class ArrangeCollectionUnitTests\n{\n    private (DeliveriesController controller, Data.DeliveryDbContext db, Microsoft.Data.Sqlite.SqliteConnection conn) SetupTest()\n    {\n        var db = TestDbContextFactory.CreateDbContext(out var conn);\n        var logger = NullLogger\u003CDeliveriesController\u003E.Instance;\n        var controller = new DeliveriesController(db, logger);\n        return (controller, db, conn);\n    }\n\n    [Fact]\n    public async Task A_U01_DonorArrangesCollection_ValidFutureTime_Returns201Created()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            TestDbContextFactory.SeedRequest(db, requestId: 101, donationId: 201, donorId: \u0022donor_1\u0022, orgId: \u0022org_1\u0022, status: \u0022ACCEPTED\u0022);\n            db.ChangeTracker.Clear();\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_1\u0022, \u0022DONOR\u0022);\n\n            var dto = new ArrangeCollectionDto\n            {\n                RequestId = 101,\n                PickupAddress = \u0022 123 Main St, Bakery \u0022,\n                DeliveryAddress = \u0022 456 Shelter Ave \u0022,\n                ContactName = \u0022 Jane Doe \u0022,\n                ContactPhone = \u0022 \u002B1234567890 \u0022,\n                ScheduledCollectionTime = DateTimeOffset.UtcNow.AddDays(1),\n                Notes = \u0022 Handle with care \u0022\n            };\n\n            // Act\n            var result = await controller.ArrangeCollection(dto) as CreatedAtActionResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(201);\n            var response = result.Value as ApiResponse\u003CDeliveryTrackingResponseDto\u003E;\n            response.Should().NotBeNull();\n            response!.Success.Should().BeTrue();\n            response.Data.Should().NotBeNull();\n            response.Message.Should().Contain(\u0022Collection arrangement created successfully\u0022);\n\n            var arrangement = await db.DeliveryArrangements.Include(d =\u003E d.History).FirstOrDefaultAsync(d =\u003E d.RequestId == 101);\n            arrangement.Should().NotBeNull();\n            arrangement!.Status.Should().Be(\u0022CollectionArranged\u0022);\n            arrangement.PickupAddress.Should().Be(\u0022123 Main St, Bakery\u0022);\n            arrangement.DeliveryAddress.Should().Be(\u0022456 Shelter Ave\u0022);\n            arrangement.ContactName.Should().Be(\u0022Jane Doe\u0022);\n            arrangement.ContactPhone.Should().Be(\u0022\u002B1234567890\u0022);\n            arrangement.Notes.Should().Be(\u0022Handle with care\u0022);\n            arrangement.ScheduledCollectionTime.Kind.Should().Be(DateTimeKind.Utc);\n            arrangement.ArrangedAt.Should().NotBe(default);\n            arrangement.CreatedAt.Should().NotBe(default);\n\n            arrangement.History.Should().HaveCount(1);\n            var history = arrangement.History.First();\n            history.PreviousStatus.Should().Be(\u0022Accepted\u0022);\n            history.NewStatus.Should().Be(\u0022CollectionArranged\u0022);\n            history.ChangedByUserId.Should().Be(\u0022donor_1\u0022);\n            history.ChangedByRole.Should().Be(\u0022DONOR\u0022);\n            history.Notes.Should().Be(\u0022Handle with care\u0022);\n\n            var notifications = await db.DeliveryNotifications.ToListAsync();\n            notifications.Should().HaveCount(2);\n            notifications.Should().Contain(n =\u003E n.UserId == \u0022donor_1\u0022 \u0026\u0026 n.Type == \u0022COLLECTION_ARRANGED\u0022 \u0026\u0026 !n.IsRead \u0026\u0026 n.RelatedId == arrangement.Id);\n            notifications.Should().Contain(n =\u003E n.UserId == \u0022org_1\u0022 \u0026\u0026 n.Type == \u0022COLLECTION_ARRANGED\u0022 \u0026\u0026 !n.IsRead \u0026\u0026 n.RelatedId == arrangement.Id);\n        }\n    }\n\n    [Fact]\n    public async Task A_U02_IntendedOrganizationArrangesCollection_Returns201WithOrgAudit()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            TestDbContextFactory.SeedRequest(db, requestId: 102, donationId: 202, donorId: \u0022donor_2\u0022, orgId: \u0022org_2\u0022, status: \u0022ACCEPTED\u0022);\n            db.ChangeTracker.Clear();\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022org_2\u0022, \u0022ORGANIZATION\u0022);\n\n            var dto = new ArrangeCollectionDto\n            {\n                RequestId = 102,\n                PickupAddress = \u0022789 Donor Hub\u0022,\n                DeliveryAddress = \u0022321 Org Center\u0022,\n                ContactName = \u0022John Smith\u0022,\n                ContactPhone = \u00229876543210\u0022,\n                ScheduledCollectionTime = DateTimeOffset.UtcNow.AddHours(5)\n            };\n\n            // Act\n            var result = await controller.ArrangeCollection(dto) as CreatedAtActionResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(201);\n            var response = result.Value as ApiResponse\u003CDeliveryTrackingResponseDto\u003E;\n            response!.Success.Should().BeTrue();\n\n            var history = await db.DeliveryStatusHistories.FirstOrDefaultAsync(h =\u003E h.ChangedByUserId == \u0022org_2\u0022);\n            history.Should().NotBeNull();\n            history!.ChangedByRole.Should().Be(\u0022ORGANIZATION\u0022);\n\n            var notifications = await db.DeliveryNotifications.ToListAsync();\n            notifications.Should().HaveCount(2);\n        }\n    }\n\n    [Fact]\n    public async Task A_U03_ValidArrangement_IncludesWhitespaceNotes_NotesAreTrimmed()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            TestDbContextFactory.SeedRequest(db, requestId: 103, donationId: 203, donorId: \u0022donor_3\u0022, orgId: \u0022org_3\u0022);\n            db.ChangeTracker.Clear();\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_3\u0022, \u0022DONOR\u0022);\n\n            var dto = new ArrangeCollectionDto\n            {\n                RequestId = 103,\n                PickupAddress = \u0022Addr A\u0022,\n                DeliveryAddress = \u0022Addr B\u0022,\n                ContactName = \u0022Contact C\u0022,\n                ContactPhone = \u002212345\u0022,\n                ScheduledCollectionTime = DateTimeOffset.UtcNow.AddDays(2),\n                Notes = \u0022   Padded notes text   \u0022\n            };\n\n            // Act\n            await controller.ArrangeCollection(dto);\n\n            // Assert\n            var arrangement = await db.DeliveryArrangements.Include(d =\u003E d.History).FirstAsync(d =\u003E d.RequestId == 103);\n            arrangement.Notes.Should().Be(\u0022Padded notes text\u0022);\n            arrangement.History.First().Notes.Should().Be(\u0022Padded notes text\u0022);\n        }\n    }\n\n    [Fact]\n    public async Task A_U04_NotesOmitted_ArrangementSucceeds_NotesAreNull()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            TestDbContextFactory.SeedRequest(db, requestId: 104, donationId: 204, donorId: \u0022donor_4\u0022, orgId: \u0022org_4\u0022);\n            db.ChangeTracker.Clear();\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_4\u0022, \u0022DONOR\u0022);\n\n            var dto = new ArrangeCollectionDto\n            {\n                RequestId = 104,\n                PickupAddress = \u0022Addr A\u0022,\n                DeliveryAddress = \u0022Addr B\u0022,\n                ContactName = \u0022Contact C\u0022,\n                ContactPhone = \u002212345\u0022,\n                ScheduledCollectionTime = DateTimeOffset.UtcNow.AddDays(2),\n                Notes = null\n            };\n\n            // Act\n            var result = await controller.ArrangeCollection(dto) as CreatedAtActionResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            var arrangement = await db.DeliveryArrangements.FirstAsync(d =\u003E d.RequestId == 104);\n            arrangement.Notes.Should().BeNull();\n        }\n    }\n\n    [Fact]\n    public async Task A_U05_RequestIdMissingOrZero_ReturnsClientError()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_1\u0022, \u0022DONOR\u0022);\n\n            var dto = new ArrangeCollectionDto\n            {\n                RequestId = 0,\n                PickupAddress = \u0022Addr\u0022,\n                DeliveryAddress = \u0022Addr\u0022,\n                ContactName = \u0022Name\u0022,\n                ContactPhone = \u0022123\u0022,\n                ScheduledCollectionTime = DateTimeOffset.UtcNow.AddDays(1)\n            };\n\n            // Act\n            var result = await controller.ArrangeCollection(dto) as NotFoundObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(404);\n            (await db.DeliveryArrangements.CountAsync()).Should().Be(0);\n        }\n    }\n\n    [Fact]\n    public async Task A_U06_PickupAddressInvalid_ReturnsValidationError()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_1\u0022, \u0022DONOR\u0022);\n            controller.ModelState.AddModelError(\u0022PickupAddress\u0022, \u0022The PickupAddress field is required.\u0022);\n\n            var dto = new ArrangeCollectionDto { RequestId = 101, PickupAddress = \u0022\u0022 };\n\n            // Act\n            var result = await controller.ArrangeCollection(dto) as BadRequestObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(400);\n            (await db.DeliveryArrangements.CountAsync()).Should().Be(0);\n        }\n    }\n\n    [Fact]\n    public async Task A_U07_DeliveryAddressInvalid_ReturnsValidationError()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_1\u0022, \u0022DONOR\u0022);\n            controller.ModelState.AddModelError(\u0022DeliveryAddress\u0022, \u0022The DeliveryAddress field is required.\u0022);\n\n            var dto = new ArrangeCollectionDto { RequestId = 101, DeliveryAddress = \u0022\u0022 };\n\n            // Act\n            var result = await controller.ArrangeCollection(dto) as BadRequestObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(400);\n            (await db.DeliveryArrangements.CountAsync()).Should().Be(0);\n        }\n    }\n\n    [Fact]\n    public async Task A_U08_ContactNameInvalid_ReturnsValidationError()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            controller.ControllerContext = ControllerTestHelper.CreateCon / Act\n            var result = await controller.ArrangeCollection(dto) as ObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            (result!.StatusCode == 400 || result.StatusCode == 500).Should().BeTrue();\n        }\n    }\n}\n","tests":[{"id":"040168e3-9ff5-f64f-1eec-001411df3842","name":"DeliveryWorkflowService.UnitTests.ArrangeCollectionUnitTests.A_U01_DonorArrangesCollection_ValidFutureTime_Returns201Created","location":{"start":{"line":26,"column":5},"end":{"line":85,"column":6}}},{"id":"3fb30fd1-7c41-cdad-6c09-410a4c23019a","name":"DeliveryWorkflowService.UnitTests.ArrangeCollectionUnitTests.A_U02_IntendedOrganizationArrangesCollection_Returns201WithOrgAudit","location":{"start":{"line":87,"column":5},"end":{"line":124,"column":6}}},{"id":"9f6e05db-55b3-9a4c-9c88-f5c9403c065a","name":"DeliveryWorkflowService.UnitTests.ArrangeCollectionUnitTests.A_U03_ValidArrangement_IncludesWhitespaceNotes_NotesAreTrimmed","location":{"start":{"line":126,"column":5},"end":{"line":156,"column":6}}},{"id":"e66a7ee0-7556-ecff-91eb-cd38c7dcaeaa","name":"DeliveryWorkflowService.UnitTests.ArrangeCollectionUnitTests.A_U04_NotesOmitted_ArrangementSucceeds_NotesAreNull","location":{"start":{"line":158,"column":5},"end":{"line":188,"column":6}}},{"id":"7d261cd9-7c79-52c7-7c57-370836b60c2e","name":"DeliveryWorkflowService.UnitTests.ArrangeCollectionUnitTests.A_U05_RequestIdMissingOrZero_ReturnsClientError","location":{"start":{"line":190,"column":5},"end":{"line":217,"column":6}}},{"id":"b5b48600-c823-8cd1-cf25-2b3f51deb17b","name":"DeliveryWorkflowService.UnitTests.ArrangeCollectionUnitTests.A_U06_PickupAddressInvalid_ReturnsValidationError","location":{"start":{"line":219,"column":5},"end":{"line":239,"column":6}}},{"id":"0d6e7106-4480-bf99-af7e-eafffe9aac52","name":"DeliveryWorkflowService.UnitTests.ArrangeCollectionUnitTests.A_U07_DeliveryAddressInvalid_ReturnsValidationError","location":{"start":{"line":241,"column":5},"end":{"line":261,"colum ).NotBeNull();\n            response.Data!.Status.Should().Be(\u0022Completed\u0022);\n            response.Data.CompletedAt.Should().NotBeNull();\n            response.Data.UpdatedAt.Should().NotBeNull();\n\n            var updated = await db.DeliveryArrangements.Include(d =\u003E d.History).FirstAsync(d =\u003E d.Id == arrangement.Id);\n            updated.Status.Should().Be(\u0022Completed\u0022);\n            updated.CompletedAt.Should().NotBeNull();\n\n            var history = updated.History.FirstOrDefault(h =\u003E h.NewStatus == \u0022Completed\u0022);\n            history.Should().NotBeNull();\n            history!.PreviousStatus.Should().Be(\u0022Received\u0022);\n            history.ChangedByUserId.Should().Be(\u0022donor_d\u0022);\n            history.Notes.Should().Be(\u0022Everything distributed to families\u0022);\n\n            var notifications = await db.DeliveryNotifications.Where(n =\u003E n.RelatedId == arrangement.Id \u0026\u0026 n.Type == \u0022DONATION_COMPLETED\u0022).ToListAsync();\n            notifications.Should().HaveCount(2);\n            notifications.Should().Contain(n =\u003E n.UserId == \u0022donor_d\u0022 \u0026\u0026 !n.IsRead);\n            notifications.Should().Contain(n =\u003E n.UserId == \u0022org_d\u0022 \u0026\u0026 !n.IsRead);\n        }\n    }\n\n    [Fact]\n    public async Task D_U02_DonorCompletesReceivedDonation_SuccessfulTransition()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = await SeedArrangementAsync(db, \u0022Received\u0022);\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_d\u0022, \u0022DONOR\u0022);\n\n            // Act\n            var result = await controller.CompleteDonation(arrangement.Id) as OkObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(200);\n        }\n    }\n\n    [Fact] angement = await SeedArrangementAsync(db, \u0022Received\u0022);\n            TestDbContextFactory.SeedRequest(\n                db,\n                arrangement.RequestId,\n                arrangement.DonationId,\n                arrangement.DonorId,\n                arrangement.OrganizationId,\n                \u0022ACCEPTED\u0022);\n\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_d\u0022, \u0022DONOR\u0022);\n\n            // Act\n            var result = await controller.CompleteDonation(arrangement.Id) as OkObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(200);\n\n            // Verify Requests table was updated to COMPLETED via SQL sync\n            using var cmd = conn.CreateCommand();\n            cmd.CommandText = \u0022SELECT \\\u0022Status\\\u0022 FROM \\\u0022Requests\\\u0022 WHERE \\\u0022Id\\\u0022 = \u0022 \u002B arrangement.RequestId;\n            var statusInRequests = (string?)cmd.ExecuteScalar();\n            statusInRequests.Should().Be(\u0022COMPLETED\u0022);\n        }\n    }\n}\n","tests":[{"id":"e7885410-1d07-fe63-fcaf-ac9b81d9f7fd","name":"DeliveryWorkflowService.UnitTests.CompleteDonationUnitTests.D_U01_AuthorizedUserCompletesReceivedDonation_Returns200OK_StatusIsCompleted","location":{"start":{"line":55,"column":5},"end":{"line":95,"column":6}}},{"id":"6ff32625-5341-86cc-9fc3-b03022794389","name":"DeliveryWorkflowService.UnitTests.CompleteDonationUnitTests.D_U02_DonorCompletesReceivedDonation_SuccessfulTransition","location":{"start":{"line":97,"column":5},"end":{"line":114,"column":6}}},{"id":"16aca4b1-f41e-e502-6560-688ebcb4907b","name":"DeliveryWorkflowService.UnitTests.CompleteDonationUnitTests.D_U03_IntendedOrganizationCompletesReceivedDonation_SuccessfulTransition","location":{"start":{"line":116,"column":5},"end":{"line":136,"column":6}}},{"id":"ef02547a-3f1c-3364-22fd-5a6f5bb30bc8","name":"DeliveryWorkfl n            ArrangedAt = DateTime.UtcNow.AddHours(-2),\n            CollectedAt = status == \u0022Collected\u0022 || status == \u0022Received\u0022 || status == \u0022Completed\u0022 ? DateTime.UtcNow.AddHours(-1) : null,\n            CreatedAt = DateTime.UtcNow.AddHours(-2)\n        };\n\n        db.DeliveryArrangements.Add(arrangement);\n        await db.SaveChangesAsync();\n        db.ChangeTracker.Clear();\n        return arrangement;\n    }\n\n    [Fact]\n    public async Task R_U01_IntendedOrganizationConfirmsReceipt_Returns200OK_StatusIsReceived()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = await SeedArrangementAsync(db, \u0022Collected\u0022);\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022org_r\u0022, \u0022ORGANIZATION\u0022);\n\n            var dto = new ConfirmReceiptDto { Notes = \u0022 Received in good condition \u0022 };\n\n            // Act\n            var result = await controller.ConfirmReceipt(arrangement.Id, dto) as OkObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(200);\n            var response = result.Value as ApiResponse\u003CDeliveryTrackingResponseDto\u003E;\n            response!.Success.Should().BeTrue();\n            response.Data.Should().NotBeNull();\n            response.Data!.Status.Should().Be(\u0022Received\u0022);\n            response.Data.ReceivedAt.Should().NotBeNull();\n\n            var updatedArrangement = await db.DeliveryArrangements.Include(d =\u003E d.History).FirstAsync(d =\u003E d.Id == arrangement.Id);\n            updatedArrangement.Status.Should().Be(\u0022Received\u0022);\n            updatedArrangement.ReceivedAt.Should().NotBeNull();\n\n            var history = updatedArrangement.History.FirstOrDefault(h =\u003E h.NewStatus == \u0022Received\u0022);\n            history.Should().NotBeNull();\n            history!.PreviousStatus.Should().Be(\u0022Collected\u0022);\n            history.ChangedByUserId.Should().Be(\u0022org_r\u0022);\n            history.ChangedByRole.Should().Be(\u0022ORGANIZATION\u0022);\n            history.Notes.Should().Be(\u0022Received in good condition\u0022);\n\n            // Verify ONLY Donor notification of type RECEIPT_CONFIRMED is created\n            var notifications = await db.DeliveryNotifications.Where(n =\u003E n.RelatedId == arrangement.Id \u0026\u0026 n.Type == \u0022RECEIPT_CONFIRMED\u0022).ToListAsync();\n            notifications.Should().HaveCount(1);\n            notifications.First().UserId.Should().Be(\u0022donor_r\u0022);\n            notifications.First().IsRead.Should().BeFalse();\n        }\n    }\n\n    [Fact]\n    public async Task R_U02_DonorAttemptsToConfirmReceipt_Returns403Forbidden()\n    {\n        // Arrange\n        var (controller, db, conn) = SetupTest();\n        using (conn)\n        {\n            var arrangement = await SeedArrangementAsync(db, \u0022Collected\u0022);\n            controller.ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_r\u0022, \u0022DONOR\u0022);\n\n            // Act\n            var result = await controller.ConfirmReceipt(arrangement.Id) as ObjectResult;\n\n            // Assert\n            result.Should().NotBeNull();\n            result!.StatusCode.Should().Be(403);\n            var response = result.Value as ApiResponse\u003CDeliveryTrackingResponseDto\u003E;\n            response!.Message.Should().Contain(\u0022Only the designated receiving organization is authorized\u0022);\n\n            var unchanged = await db.DeliveryArrangements.FirstAsync(d =\u003E d.Id == arrangement.Id);\n            unchanged.Status.Should().Be(\u0022Collected\u0022);\n            unchanged.ReceivedAt.Should().BeNull();\n        }\n    }\n\n    [Fact]\n    public async Task R_U03_UnrelatedOrganizationAttemptsConfirmReceipt_Returns403Forbidden()\n    {\n geTracker.Clear();\n\n            var loggerMock = new Mock\u003CILogger\u003CDeliveriesController\u003E\u003E();\n            var controller = new DeliveriesController(db, loggerMock.Object)\n            {\n                ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_mock\u0022, \u0022DONOR\u0022)\n            };\n\n            var dto = new ArrangeCollectionDto\n            {\n                RequestId = 1001,\n                PickupAddress = \u0022100 Baker St\u0022,\n                DeliveryAddress = \u0022200 Community Center\u0022,\n                ContactName = \u0022Bob Smith\u0022,\n                ContactPhone = \u0022\u002B1555123456\u0022,\n                ScheduledCollectionTime = DateTimeOffset.UtcNow.AddDays(2),\n                Notes = \u0022Fragile baked goods\u0022\n            };\n\n            // Act\n            var result = await controller.ArrangeCollection(dto);\n\n            // Assert\n            result.Should().BeOfType\u003CCreatedAtActionResult\u003E();\n            var created = (result as CreatedAtActionResult)!.Value as ApiResponse\u003CDeliveryTrackingResponseDto\u003E;\n            created.Should().NotBeNull();\n            created!.Success.Should().BeTrue();\n            created.Data!.Status.Should().Be(\u0022CollectionArranged\u0022);\n\n            // Verify in DB stub\n            var inDb = await db.DeliveryArrangements.FirstOrDefaultAsync(d =\u003E d.RequestId == 1001);\n            inDb.Should().NotBeNull();\n            inDb!.Status.Should().Be(\u0022CollectionArranged\u0022);\n\n            // Verify Mock Logger was called with Information level\n            VerifyLoggerCall(loggerMock, LogLevel.Information);\n        }\n    }\n\n    [Fact]\n    public async Task RecordCollection_WithMockLogger_LogsInformation_AndTransitionsToCollected()\n    {\n        // Arrange\n        var db = TestDbContextFactory.CreateDbContext(out var conn);\n        using (conn)\n        {\n            var arrangeme        var arrangement = new DeliveryArrangement\n            {\n                RequestId = 1003,\n                DonationId = 2003,\n                DonorId = \u0022donor_mock\u0022,\n                OrganizationId = \u0022org_mock\u0022,\n                PickupAddress = \u0022A\u0022,\n                DeliveryAddress = \u0022B\u0022,\n                ContactName = \u0022C\u0022,\n                ContactPhone = \u0022123\u0022,\n                ScheduledCollectionTime = DateTime.UtcNow.AddHours(-1),\n                Status = \u0022Collected\u0022,\n                CollectedAt = DateTime.UtcNow.AddHours(-1),\n                CreatedAt = DateTime.UtcNow,\n                UpdatedAt = DateTime.UtcNow\n            };\n            db.DeliveryArrangements.Add(arrangement);\n            await db.SaveChangesAsync();\n\n            var loggerMock = new Mock\u003CILogger\u003CDeliveriesController\u003E\u003E();\n            var controller = new DeliveriesController(db, loggerMock.Object)\n            {\n                ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022org_mock\u0022, \u0022ORGANIZATION\u0022)\n            };\n\n            var dto = new ConfirmReceiptDto\n            {\n                Notes = \u0022Received in good condition\u0022\n            };\n\n            // Act\n            var result = await controller.ConfirmReceipt(arrangement.Id, dto);\n\n            // Assert\n            result.Should().BeOfType\u003COkObjectResult\u003E();\n            var ok = (result as OkObjectResult)!.Value as ApiResponse\u003CDeliveryTrackingResponseDto\u003E;\n            ok!.Success.Should().BeTrue();\n            ok.Data!.Status.Should().Be(\u0022Received\u0022);\n\n            // Verify Mock Logger\n            VerifyLoggerCall(loggerMock, LogLevel.Information);\n        }\n    }\n\n    [Fact]\n    public async Task CompleteDonation_WithMockLogger_LogsInformation_AndTransitionsToCompleted()\n    {\n        // Arrange\n        var db = TestDbConte         DonationId = 2006,\n                DonorId = \u0022donor_mock\u0022,\n                OrganizationId = \u0022org_mock\u0022,\n                PickupAddress = \u0022A\u0022,\n                DeliveryAddress = \u0022B\u0022,\n                ContactName = \u0022C\u0022,\n                ContactPhone = \u0022123\u0022,\n                ScheduledCollectionTime = DateTime.UtcNow.AddHours(1),\n                Status = \u0022CollectionArranged\u0022\n            };\n            db.DeliveryArrangements.Add(arrangement);\n            await db.SaveChangesAsync();\n\n            var loggerMock = new Mock\u003CILogger\u003CDeliveriesController\u003E\u003E();\n            var controller = new DeliveriesController(db, loggerMock.Object)\n            {\n                ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022donor_mock\u0022, \u0022DONOR\u0022)\n            };\n\n            // Act 1: Existing\n            var existingResult = await controller.GetTrackingByRequestId(1006);\n            existingResult.Should().BeOfType\u003COkObjectResult\u003E();\n\n            // Act 2: Not found\n            var notFoundResult = await controller.GetTrackingByRequestId(99999);\n            notFoundResult.Should().BeOfType\u003CNotFoundObjectResult\u003E();\n        }\n    }\n\n    [Fact]\n    public async Task GetAdminDeliverySummary_WithMockLogger_ReturnsSummaryMetrics()\n    {\n        // Arrange\n        var db = TestDbContextFactory.CreateDbContext(out var conn);\n        using (conn)\n        {\n            db.DeliveryArrangements.AddRange(\n                new DeliveryArrangement { RequestId = 1, DonationId = 1, DonorId = \u0022d1\u0022, OrganizationId = \u0022o1\u0022, PickupAddress = \u0022A\u0022, DeliveryAddress = \u0022B\u0022, ContactName = \u0022C\u0022, ContactPhone = \u00221\u0022, Status = \u0022CollectionArranged\u0022 },\n                new DeliveryArrangement { RequestId = 2, DonationId = 2, DonorId = \u0022d2\u0022, OrganizationId = \u0022o2\u0022, PickupAddress = \u0022A\u0022, DeliveryAddress = \u0022B\u0022, ContactName = \u0022C\u0022, ContactPhone = \u00221\u0022, Status = \u0022Collected\u0022 },\n                new DeliveryArrangement { RequestId = 3, DonationId = 3, DonorId = \u0022d3\u0022, OrganizationId = \u0022o3\u0022, PickupAddress = \u0022A\u0022, DeliveryAddress = \u0022B\u0022, ContactName = \u0022C\u0022, ContactPhone = \u00221\u0022, Status = \u0022Completed\u0022 }\n            );\n            await db.SaveChangesAsync();\n\n            var loggerMock = new Mock\u003CILogger\u003CDeliveriesController\u003E\u003E();\n            var controller = new DeliveriesController(db, loggerMock.Object)\n            {\n                ControllerContext = ControllerTestHelper.CreateControllerContext(\u0022admin_1\u0022, \u0022ADMIN\u0022)\n            };\n\n            // Act\n            var result = await controller.GetAdminDeliverySummary();\n\n            // Assert\n            result.Should().BeOfType\u003COkObjectResult\u003E();\n            var ok = (result as OkObjectResult)!.Value as ApiResponse\u003Cobject\u003E;\n            ok!.Success.Should().BeTrue();\n            ok.Data.Should().NotBeNull();\n        }\n    }\n\n    [Fact]\n    public async Task NotificationsController_WithMockLogger_RetrievesAndMarksRead()\n    {\n        // Arrange\n        var db = TestDbContextFactory.CreateDbContext(out var conn);\n        using (conn)\n        {\n            var notif = new DeliveryNotification\n            {\n                UserId = \u0022user_mock\u0022,\n                Title = \u0022Driver Assigned\u0022,\n                Message = \u0022Your food is on the way\u0022,\n                Type = \u0022DRIVER_ASSIGNED\u0022,\n                IsRead = false,\n                CreatedAt = DateTime.UtcNow\n            };\n            db.DeliveryNotifications.Add(notif);\n            await db.SaveChangesAsync();\n\n            var notifLoggerMock = new Mock\u003CILogger\u003CNotifications
